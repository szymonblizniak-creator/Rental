<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Rental" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>Rental — panel gospodarza</title>
<style>
/* ================================================================= */
/*  Motyw: jasny, oparty na systemie wizualnym Airbnb                 */
/* ================================================================= */
:root{
  /* powierzchnie */
  --bg:#FFFFFF; --bg2:#F7F7F7; --panel:#FFFFFF; --panel2:#F7F7F7;
  --edge:#DDDDDD; --edge2:#222222;
  /* typografia */
  --txt:#222222; --dim:#717171; --faint:#B0B0B0;
  /* akcenty — rausch, babu, arches z palety Airbnb */
  --gold:#FF385C; --green:#008A05; --red:#C13515; --blue:#008A8C;
  --violet:#7048E8; --orange:#FC642D;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --mono:inherit;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--txt);background:var(--bg);
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;padding:0 20px calc(100px + var(--sb))}

/* ---------- pasek statystyk ---------- */
#hud{position:sticky;top:0;z-index:5;margin:0 -20px 18px;padding:calc(var(--st) + 12px) 20px 14px;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--edge)}
.hudrow{display:flex;gap:22px}
.res{flex:1;display:flex;flex-direction:column;gap:3px}
.res b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.res span{font-size:12px;color:var(--dim);font-weight:400}

/* ---------- karty ---------- */
.panel{margin-bottom:16px;border-radius:12px;overflow:hidden;background:var(--panel);
  border:1px solid var(--edge)}
.ptitle{display:flex;align-items:center;gap:10px;padding:16px 18px 0;
  font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--txt)}
.ptitle .grow{flex:1}
.pbody{padding:14px 18px 18px}

h1{font-size:24px;font-weight:600;letter-spacing:-.025em;margin:0}
.mono{font-variant-numeric:tabular-nums}
.huge{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1.15;margin:0;
  font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:14px}
.tiny{color:var(--dim);font-size:12px;line-height:1.5}
.lbl{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:400}

/* ---------- pola ---------- */
input,textarea,select{font-family:inherit}
.field{width:100%;border-radius:8px;padding:13px 14px;font-size:16px;color:var(--txt);
  background:#fff;border:1px solid #B0B0B0;font-variant-numeric:tabular-nums;
  transition:border-color .15s ease,box-shadow .15s ease}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.field-xl{font-size:30px;font-weight:600;text-align:right;padding:14px 16px;letter-spacing:-.03em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ---------- przyciski ---------- */
.btn{border:1px solid var(--txt);border-radius:8px;min-height:48px;padding:0 20px;
  font-size:16px;font-weight:600;cursor:pointer;color:var(--txt);background:#fff;
  transition:background .15s ease,transform .1s ease}
.btn:active{transform:scale(.98);background:var(--bg2)}
.btn-go{background:linear-gradient(90deg,#E61E4D,#E31C5F 50%,#D70466);color:#fff;border:none}
.btn-go:active{background:#C90A50}
.btn-ok{background:var(--txt);color:#fff;border-color:var(--txt)}
.btn-ok:active{background:#000}
.del{background:none;border:none;color:var(--dim);font-size:16px;padding:8px;cursor:pointer;
  border-radius:50%}
.del:active{background:var(--bg2);color:var(--red)}

.chip{min-height:40px;padding:0 16px;border-radius:22px;font-size:14px;cursor:pointer;
  color:var(--txt);background:#fff;border:1px solid var(--edge);
  display:inline-flex;align-items:center;gap:7px;margin:0 8px 8px 0;font-weight:500;
  transition:border-color .15s ease,background .15s ease}
.chip[data-on="1"]{background:#F7F7F7;border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.chip:active{transform:scale(.97)}

/* ---------- paski postępu ---------- */
.meter{height:8px;border-radius:4px;background:#EBEBEB;overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:4px;transition:width .3s ease}
.meter b{display:none}
.meterval{display:flex;justify-content:space-between;margin-top:7px;font-size:13px;color:var(--dim)}

/* ---------- listy ---------- */
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #EBEBEB}
.row:last-child{border-bottom:none}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right}
.tap{background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;
  display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.tap:active{opacity:.55}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.tag{border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600}
.t-ok{background:#F0F9F0;color:var(--green)}
.t-no{background:#FFF8F6;color:var(--red)}
.t-au{background:#F7F7F7;color:var(--dim);font-weight:500}

/* ---------- nawigacja ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(10px + var(--sb));background:#fff;border-top:1px solid var(--edge)}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;padding:6px 0;color:var(--dim);
  font-size:11px;font-weight:500;letter-spacing:.01em;cursor:pointer;
  transition:color .15s ease}
#tabbar button[data-on="1"]{color:var(--gold)}
#tabbar button:active{opacity:.6}
#tabbar .ico{display:block}
/* aktywna zakładka: nieco mocniejsza kreska zamiast wypełnienia kolorem */
#tabbar button[data-on="1"] .ico{stroke-width:2}

#fab{position:fixed;right:20px;bottom:calc(88px + var(--sb));z-index:31;width:56px;height:56px;
  border-radius:50%;border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,#E61E4D,#E31C5F 50%,#D70466);
  box-shadow:0 4px 14px rgba(0,0,0,.22)}
#fab:active{transform:scale(.94)}

/* ---------- arkusz ---------- */
#backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;
  padding:10px 20px calc(22px + var(--sb));border-radius:16px 16px 0 0;background:#fff;
  box-shadow:0 -6px 24px rgba(0,0,0,.16);animation:up .28s cubic-bezier(.2,.9,.3,1) both}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--edge);margin:4px auto 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}

#toastHost{position:fixed;left:0;right:0;bottom:calc(150px + var(--sb));z-index:50;
  display:flex;justify-content:center;pointer-events:none;padding:0 20px}
#toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:520px;width:100%;
  padding:14px 16px;border-radius:12px;font-size:14px;background:var(--txt);color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.28)}
#toast button{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
  background:#fff;color:var(--txt);cursor:pointer}

.hidden{display:none!important}
.mb8{margin-bottom:10px}.mb12{margin-bottom:14px}.mt10{margin-top:12px}.mt16{margin-top:18px}
label.btn{display:flex;align-items:center;justify-content:center}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#EBEBEB}
.bars i{display:block;height:100%}

</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div id="scroll"></div>
  <button id="fab" data-act="open-sheet" aria-label="Dodaj rezerwację"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav id="tabbar"></nav>
</div>
<div id="modal"></div>
<div id="toastHost"></div>

<script>
"use strict";

/* ================================================================= */
/*  1. Narzędzia                                                      */
/* ================================================================= */

var MS=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
var ML=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];

function n(v){var x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:0;}
function eur(v,d){d=d||0;return new Intl.NumberFormat("pl-PL",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(isFinite(v)?v:0);}
function pct(v,d){d=d==null?0:d;return ((isFinite(v)?v*100:0).toFixed(d).replace(".",","))+"%";}
function num(v,d){d=d==null?1:d;return isFinite(v)?v.toFixed(d).replace(".",","):"—";}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return iso(new Date());}
function yesterdayISO(){return iso(new Date(Date.now()-864e5));}
function curMonth(){return todayISO().slice(0,7);}
function mKey(x){return String(x).slice(0,7);}
function mName(k){var p=k.split("-");return ML[+p[1]-1]+" "+p[0];}
function mShort(k){var p=k.split("-");return MS[+p[1]-1];}
function daysIn(k){var p=k.split("-");return new Date(+p[0],+p[1],0).getDate();}
function shiftMonth(k,d){var p=k.split("-");var x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");}
function dayLabel(x){var p=x.split("-");return (+p[2])+" "+MS[+p[1]-1];}
function yearOf(k){return k.split("-")[0];}

/* ================================================================= */
/*  2. Dane                                                           */
/*                                                                    */
/*  Koszty stałe są definiowane raz w Ustawieniach i naliczane        */
/*  automatycznie w każdym miesiącu. W danym miesiącu można je        */
/*  nadpisać — zmiana nie rusza pozostałych miesięcy.                 */
/* ================================================================= */

var STORE_KEY="rental-tracker-mobile-v1";

var CATS=[
  {id:"repairs",label:"Naprawy",color:"#C13515"},
  {id:"supplies",label:"Zakupy",color:"#7048E8"},
  {id:"cleaning_extra",label:"Sprzątanie extra",color:"#008A8C"},
  {id:"utilities",label:"Media",color:"#FC642D"},
  {id:"other",label:"Inne",color:"#717171"}
];
function catOf(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i];}return CATS[4];}

function defaultSettings(){
  return {
    recurring:[
      {id:"comunidad",name:"Comunidad",amount:145},
      {id:"internet",name:"Internet",amount:35},
      {id:"ochrona",name:"Ochrona",amount:25},
      {id:"insurance",name:"Ubezpieczenie",amount:22}
    ],
    management:0,                       /* domyślna prowizja za zarządzanie */
    electricity:{rate:.24,standing:12},
    water:{rate:2.1,standing:8},
      ibiAnnual:696, taxRate:19,
    deduct:{commission:false,extras:false}
  };
}

function seed(){
  var m0=curMonth(), m1=shiftMonth(m0,-1), m2=shiftMonth(m0,-2);
  var d=function(k,x){return k+"-"+String(x).padStart(2,"0");};
  var st=defaultSettings();
  var snap=function(){return st.recurring.map(function(c){return {id:c.id,name:c.name,amount:c.amount};});};
  var months={};
  months[m2]={costs:snap(),management:180,
    electricity:{mode:"meter",prev:4180,curr:4402,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:796,curr:812,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"repairs",amount:240,note:"Serwis klimatyzacji"}]};
  months[m1]={costs:snap(),management:265,
    electricity:{mode:"meter",prev:4402,curr:4715,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:812,curr:835,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"supplies",amount:320,note:"Pościel i ręczniki"}]};
  months[m0]={costs:snap(),management:null,
    electricity:{mode:"meter",prev:4715,curr:null,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:835,curr:null,rate:2.1,standing:8,invoice:null},
    extras:[]};
  return {
    schema:3,
    property:{name:"Apartament",city:"Marbella",area:"Puerto Banús",country:"Hiszpania"},
    settings:st,
    reservations:[
      {id:uid(),date:d(m1,2),nights:8,amount:1760,cleaning:70,commission:52.8,guest:"Bennett (UK)"},
      {id:uid(),date:d(m1,13),nights:7,amount:1610,cleaning:60,commission:48.3,guest:"García (ES)"},
      {id:uid(),date:d(m1,24),nights:6,amount:1440,cleaning:60,commission:43.2,guest:"Schmidt (DE)"},
      {id:uid(),date:d(m0,3),nights:5,amount:1000,cleaning:55,commission:30,guest:"Jensen (DK)"},
      {id:uid(),date:d(m0,12),nights:4,amount:760,cleaning:55,commission:22.8,guest:"Nowak (PL)"}
    ],
    months:months
  };
}

/** Wczytanie danych z dowolnej wcześniejszej wersji. */
function normalize(d){
  if(!d||typeof d!=="object")return null;
  var def=defaultSettings(), s=d.settings||{};

  var recurring;
  if(Array.isArray(s.recurring)&&s.recurring.length){
    recurring=s.recurring.map(function(c){return {id:c.id||uid(),name:c.name||"Koszt",amount:n(c.amount)};});
  }else if(s.fixed){                       /* schemat 1–2: trzy sztywne pozycje */
    recurring=[
      {id:"comunidad",name:"Comunidad",amount:n(s.fixed.comunidad)},
      {id:"internet",name:"Internet",amount:n(s.fixed.internet)},
      {id:"ochrona",name:"Ochrona",amount:n(s.fixed.ochrona)}
    ];
  }else recurring=def.recurring;

  var months=(d.months&&typeof d.months==="object")?d.months:{};
  Object.keys(months).forEach(function(k){
    var m=months[k]||{};
    if(!Array.isArray(m.costs)){
      m.costs=m.fixed?[
        {id:"comunidad",name:"Comunidad",amount:n(m.fixed.comunidad)},
        {id:"internet",name:"Internet",amount:n(m.fixed.internet)},
        {id:"ochrona",name:"Ochrona",amount:n(m.fixed.ochrona)}
      ]:recurring.map(function(c){return {id:c.id,name:c.name,amount:c.amount};});
      delete m.fixed;
    }
    if(m.management===undefined)m.management=null;
    if(!Array.isArray(m.extras))m.extras=[];
    months[k]=m;
  });

  var res=Array.isArray(d.reservations)?d.reservations:[];
  var seen={};
  res.forEach(function(r){if(!r.id||seen[r.id])r.id=uid();seen[r.id]=true;});

  return {
    schema:3,
    property:Object.assign({name:"Apartament",city:"",area:"",country:""},d.property||{}),
    settings:{
      recurring:recurring,
      management:s.management!==undefined?n(s.management):0,
      electricity:Object.assign({},def.electricity,s.electricity||{}),
      water:Object.assign({},def.water,s.water||{}),
      ibiAnnual:s.ibiAnnual!==undefined?n(s.ibiAnnual):def.ibiAnnual,
      taxRate:s.taxRate!==undefined?n(s.taxRate):def.taxRate,
      deduct:{commission:!!(s.deduct&&s.deduct.commission),extras:!!(s.deduct&&s.deduct.extras)}
    },
    reservations:res,
    months:months
  };
}

function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(!raw)return seed();
    return normalize(JSON.parse(raw))||seed();
  }catch(e){console.error(e);return seed();}
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}
    catch(e){alert("Nie udało się zapisać danych: "+e.message);}
  },200);
}

var S=load();
var UI={tab:"dash",month:curMonth(),sheet:null,form:null,showAll:false,
  extra:{category:"repairs",amount:"",note:""},msg:null,paste:"",toast:null,imp:null,
  newCost:{name:"",amount:""}};
var OFFLINE={ok:false,state:"sprawdzam…",detail:"",files:0};

var toastTimer=null;
function toast(text,label,month){
  UI.toast={text:text,label:label||null,month:month||null};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){UI.toast=null;renderToast();},6000);
}

/* ================================================================= */
/*  3. Obliczenia                                                     */
/* ================================================================= */

/**
 * Zwraca dane miesiąca, tworząc je w razie potrzeby.
 *
 * Koszty stałe z Ustawień są naliczane w KAŻDYM miesiącu:
 *  - brakująca pozycja jest dopisywana zawsze, także wstecz,
 *  - kwota nadąża za Ustawieniami w miesiącu bieżącym i przyszłych,
 *  - miesiąc zamknięty (przeszły) zachowuje kwotę, którą wtedy płaciłeś,
 *  - pozycja zmieniona ręcznie w danym miesiącu (custom) nie jest nadpisywana.
 */
function ensureMonth(k){
  var s=S.settings, prev=S.months[shiftMonth(k,-1)];
  var m=S.months[k];
  if(!m){
    m=S.months[k]={
      costs:[],management:(prev&&prev.management!=null)?prev.management:(n(s.management)||null),
      electricity:{mode:"meter",prev:(prev&&prev.electricity)?prev.electricity.curr:null,curr:null,
        rate:s.electricity.rate,standing:s.electricity.standing,invoice:null},
      water:{mode:"meter",prev:(prev&&prev.water)?prev.water.curr:null,curr:null,
        rate:s.water.rate,standing:s.water.standing,invoice:null},
      extras:[]
    };
  }
  if(!Array.isArray(m.costs))m.costs=[];

  var past=k<curMonth();
  var byId={};
  m.costs.forEach(function(c){byId[c.id]=c;});
  s.recurring.forEach(function(c){
    var item=byId[c.id];
    if(!item){
      m.costs.push({id:c.id,name:c.name,amount:n(c.amount),custom:false});
    }else{
      item.name=c.name;                                  // nazwa zawsze aktualna
      if(!item.custom&&!past)item.amount=n(c.amount);     // kwota nadąża za Ustawieniami
    }
  });
  return m;
}

function utilityCost(u){
  if(!u)return {cost:0,usage:0,ready:false};
  if(u.mode==="invoice"){
    var r=u.invoice!==null&&u.invoice!=="";
    return {cost:r?n(u.invoice):0,usage:0,ready:r};
  }
  var ready=u.curr!==null&&u.curr!==""&&u.prev!==null&&u.prev!=="";
  if(!ready)return {cost:0,usage:0,ready:false};
  var usage=Math.max(0,n(u.curr)-n(u.prev));
  return {cost:usage*n(u.rate)+n(u.standing),usage:usage,ready:true};
}
function staysIn(k){return S.reservations.filter(function(r){return mKey(r.date)===k;});}

function summary(k){
  var m=ensureMonth(k), s=S.settings;
  var stays=staysIn(k);
  var revenue=0,nights=0,cleaning=0,commission=0;
  stays.forEach(function(r){revenue+=n(r.amount);nights+=n(r.nights);cleaning+=n(r.cleaning);commission+=n(r.commission);});
  var elec=utilityCost(m.electricity), water=utilityCost(m.water);
  var utilities=elec.cost+water.cost;
  var fixed=m.costs.reduce(function(a,c){return a+n(c.amount);},0);
  var management=n(m.management);
  var ibi=n(s.ibiAnnual)/12;
  var extras=m.extras.reduce(function(a,e){return a+n(e.amount);},0);
  var costs=fixed+management+ibi+utilities+cleaning+commission+extras;
  var net=revenue-costs;

  /* Koszty uzyskania przychodu.
     Sprzątanie, media, koszty stałe, prowizja za zarządzanie i IBI odliczają się zawsze.
     Prowizje portali i wydatki dodatkowe zależą od tego, czy masz na nie dokumenty —
     przełączasz to w zakładce Koszty. */
  var ded=s.deduct||{};
  var deducted=[
    {key:"cleaning",label:"Sprzątanie",value:cleaning,on:true},
    {key:"utilities",label:"Media (prąd, woda)",value:utilities,on:true},
    {key:"fixed",label:"Koszty stałe",value:fixed,on:true},
    {key:"management",label:"Prowizja za zarządzanie",value:management,on:true},
    {key:"ibi",label:"IBI (1/12 roku)",value:ibi,on:true},
    {key:"commission",label:"Prowizje portali",value:commission,on:!!ded.commission},
    {key:"extras",label:"Wydatki dodatkowe",value:extras,on:!!ded.extras}
  ];
  var deductible=deducted.reduce(function(a,d){return a+(d.on?d.value:0);},0);
  var taxBase=Math.max(0,revenue-deductible);
  var tax=taxBase*(n(s.taxRate)/100);
  var missing=[];
  if(!elec.ready)missing.push("prąd");
  if(!water.ready)missing.push("woda");
  if(m.management==null)missing.push("zarządzanie");
  return {key:k,label:mShort(k),month:m,stays:stays,revenue:revenue,nights:nights,
    cleaning:cleaning,commission:commission,elec:elec,water:water,utilities:utilities,
    fixed:fixed,management:management,ibi:ibi,extras:extras,costs:costs,net:net,tax:tax,
    deducted:deducted,deductible:deductible,taxBase:taxBase,
    netAfterTax:net-tax,adr:nights?revenue/nights:0,occupancy:nights/daysIn(k),
    utilitiesPerNight:nights?utilities/nights:0,
    missing:missing,complete:missing.length===0};
}
function yearMonths(y){
  var out=[];
  for(var i=1;i<=12;i++)out.push(summary(y+"-"+String(i).padStart(2,"0")));
  return out;
}
function yearTotals(y){
  var rows=yearMonths(y);
  var add=function(f){return rows.reduce(function(a,r){return a+r[f];},0);};
  var nights=add("nights"),revenue=add("revenue"),days=0;
  rows.forEach(function(r){days+=daysIn(r.key);});
  var withData=rows.filter(function(r){return r.revenue>0||r.costs>r.ibi;});
  return {rows:rows,revenue:revenue,costs:add("costs"),net:add("net"),tax:add("tax"),
    netAfterTax:add("netAfterTax"),nights:nights,cleaning:add("cleaning"),
    commission:add("commission"),management:add("management"),utilities:add("utilities"),
    fixed:add("fixed"),ibi:add("ibi"),extras:add("extras"),
    adr:nights?revenue/nights:0,occupancy:days?nights/days:0,
    guests:rows.reduce(function(a,r){return a+r.stays.length;},0),
    closed:rows.filter(function(r){return r.complete;}).length,
    active:withData.length};
}

function panel(title,body,extra){

}
function res(label,value,color){
  return '<div class="res"><span>'+esc(label)+'</span><b style="color:'+(color||"var(--txt)")+'">'+value+'</b></div>';
}
function line(label,value,opt){
  opt=opt||{};
  return '<div class="row"><span class="grow" style="color:'+(opt.strong?"var(--txt)":"var(--dim)")+';font-size:'+(opt.strong?14:13)+'px">'+

function meter(fraction,color,label,rightLabel){
  var w=Math.max(0,Math.min(1,fraction||0))*100;
  return '<div class="meter"><i style="width:'+w.toFixed(1)+'%;background-color:'+color+'"></i></div>'+
    (label?'<div class="meterval"><span>'+esc(label)+'</span>'+

}
function field(bind,val,suffix,attrs){

    '<input class="field" type="text" inputmode="decimal" data-bind="'+bind+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+' />'+
    (suffix?'<span class="tiny" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none">'+esc(suffix)+'</span>':'')+

}

  }).join("")+'</div>';

      '<button class="btn btn-go mt10" data-act="tab" data-val="costs" style="width:100%">Uzupełnij teraz</button></div>'));

  return h;
}

function dashChart(rows){
  var W=340,H=170,padT=10,padB=26,padL=2;
  var vals=rows.map(function(r){return r.net;});
  var max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0]));
  var span=(max-min)||1,bw=(W-padL*2)/12;
  var y0=H-padB-((0-min)/span)*(H-padT-padB);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="180" role="img" aria-label="Zysk w kolejnych miesiącach">';

  /* delikatne linie odniesienia zamiast pełnej siatki */
  [0,.5,1].forEach(function(f){
    var y=padT+f*(H-padT-padB);
    s+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="#EBEBEB" stroke-width="1"/>';
  });
  s+='<line x1="0" y1="'+y0.toFixed(1)+'" x2="'+W+'" y2="'+y0.toFixed(1)+'" stroke="#DDDDDD" stroke-width="1"/>';

  rows.forEach(function(r,i){
    var v=r.net,hgt=Math.abs(v)/span*(H-padT-padB),y=v>=0?y0-hgt:y0;
    var x=padL+i*bw+bw*.22,w=bw*.56;
    var cur=r.key===UI.month;
    /* bieżący miesiąc w kolorze marki, pozostałe w spokojnej szarości */
    var fill=cur?"#FF385C":(v>=0?"#DDDDDD":"#F0C4BC");
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+
      Math.max(3,hgt).toFixed(1)+'" rx="3" fill="'+fill+'"><title>'+mName(r.key)+": "+eur(v)+'</title></rect>';
    s+='<text x="'+(padL+i*bw+bw/2).toFixed(1)+'" y="'+(H-9)+'" font-size="10" fill="'+
      (cur?"#222222":"#B0B0B0")+'" text-anchor="middle" font-weight="'+(cur?"600":"400")+'">'+MS[i]+'</text>';
  });
  return s+'</svg>';
}

function parseMoney(raw){
  if(raw==null)return 0;
  var s=String(raw).replace(/[^\d,.\-]/g,"").trim();
  if(!s)return 0;
  var lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){s=(lc>ld)?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");}
  else if(lc>-1){s=(s.length-lc===4)?s.replace(",",""):s.replace(",",".");}
  else if(ld>-1&&s.length-ld===4&&s.split(".").length===2&&s.length>5)s=s.replace(".","");
  var v=parseFloat(s);
  return isFinite(v)?v:0;
}
function parseDate(raw,dayFirst){
  if(!raw)return null;
  var s=String(raw).trim(),m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");
  m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if(m){
    var a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    var day,mon;
    if(a>12){day=a;mon=b;}
    else if(b>12){mon=a;day=b;}
    else if(s.indexOf(".")>-1||dayFirst){day=a;mon=b;}
    else{mon=a;day=b;}
    if(mon<1||mon>12||day<1||day>31)return null;
    return y+"-"+String(mon).padStart(2,"0")+"-"+String(day).padStart(2,"0");
  }
  var d=new Date(s);
  return isNaN(d.getTime())?null:iso(d);
}
function nightsBetween(a,b){
  if(!a||!b)return 0;
  var d=(new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5;
  return d>0&&d<400?Math.round(d):0;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  var nl=text.indexOf("\n"),head=text.slice(0,nl>-1?nl:text.length);
  var delim=(head.split(";").length>head.split(",").length)?";":",";
  var rows=[],row=[],val="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; } else val+=c; }
    else{
      if(c==='"')q=true;
      else if(c===delim){row.push(val);val="";}
      else if(c==="\n"){row.push(val);rows.push(row);row=[];val="";}
      else if(c!=="\r")val+=c;
    }
  }
  if(val!==""||row.length){row.push(val);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=="";});});
}
var CSV_MAP=[
  {key:"start",names:["start date","check-in","checkin","data przyjazdu","data rozpoczęcia","przyjazd","zameldowanie","start"]},
  {key:"end",names:["end date","check-out","checkout","data wyjazdu","data zakończenia","wyjazd"]},
  {key:"nights",names:["# of nights","nights","liczba nocy","noce","noclegi"]},
  {key:"amount",names:["gross earnings","earnings","amount","payout","kwota","przychód","zarobki"]},
  {key:"host",names:["host fee","service fee","prowizja","opłata za usługę"]},
  {key:"clean",names:["cleaning fee","cleaning","sprzątanie"]},
  {key:"guest",names:["guest name","guest","gość","imię gościa"]},
  {key:"type",names:["type","typ","rodzaj"]},
  {key:"code",names:["confirmation code","kod potwierdzenia","kod rezerwacji"]}
];
function mapHeader(header){
  var idx={};
  header.forEach(function(cell,i){
    var name=String(cell).toLowerCase().trim();
    CSV_MAP.forEach(function(def){
      if(idx[def.key]!==undefined)return;
      for(var j=0;j<def.names.length;j++){
        if(name===def.names[j]||name.indexOf(def.names[j])>-1){idx[def.key]=i;return;}
      }
    });
  });
  return idx;
}
function rowsFromCSV(text,dayFirst){
  var rows=parseCSV(text);
  if(rows.length<2)return {rows:[],warnings:["Plik nie zawiera danych."]};
  var hi=-1,idx=null;
  for(var i=0;i<Math.min(rows.length,8);i++){
    var cand=mapHeader(rows[i]);
    if(cand.start!==undefined&&(cand.amount!==undefined||cand.nights!==undefined)){hi=i;idx=cand;break;}
  }
  if(hi<0)return {rows:[],warnings:["Nie rozpoznałem kolumn. Potrzebna jest data przyjazdu i kwota."]};
  var out=[],warn=[],skipped=0;
  for(var r=hi+1;r<rows.length;r++){
    var c=rows[r],get=function(kk){return idx[kk]!==undefined?c[idx[kk]]:"";};
    var type=String(get("type")).toLowerCase();
    if(type&&/payout|wypłata|adjustment|korekta|refund|zwrot/.test(type)){skipped++;continue;}
    var start=parseDate(get("start"),dayFirst);
    if(!start){skipped++;continue;}
    var nights=n(get("nights"))||nightsBetween(start,parseDate(get("end"),dayFirst))||1;
    var amount=parseMoney(get("amount"));
    if(!amount){skipped++;continue;}
    out.push({sel:true,date:start,nights:nights,amount:Math.round(amount*100)/100,
      cleaning:Math.round(parseMoney(get("clean"))*100)/100,
      commission:Math.round(Math.abs(parseMoney(get("host")))*100)/100,
      guest:String(get("guest")||get("code")||"Gość z importu").trim()||"Gość z importu"});
  }
  if(skipped)warn.push("Pominięto "+skipped+" wierszy bez daty lub kwoty (wypłaty, korekty).");
  if(idx.clean===undefined)warn.push("Brak kolumny ze sprzątaniem — uzupełnij ręcznie.");
  if(idx.host===undefined)warn.push("Brak kolumny z prowizją — uzupełnij ręcznie.");
  return {rows:out,warnings:warn};
}
var pdfjsPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise)return pdfjsPromise;
  pdfjsPromise=new Promise(function(resolve,reject){
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=function(){
      if(!window.pdfjsLib)return reject(new Error("brak pdfjsLib"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror=function(){reject(new Error("Nie udało się pobrać czytnika PDF. Przy pierwszym imporcie potrzebny jest internet."));};
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
function itemsToLines(items){
  var b={};
  items.forEach(function(it){
    var y=Math.round(it.transform[5]);
    (b[y]=b[y]||[]).push({x:it.transform[4],s:it.str});
  });
  return Object.keys(b).sort(function(a,c){return c-a;}).map(function(y){
    return b[y].sort(function(a,c){return a.x-c.x;}).map(function(o){return o.s;}).join(" ").replace(/\s+/g," ").trim();
  }).filter(function(l){return l.length>0;});
}
function rowsFromLines(lines,dayFirst){
  var out=[],warn=[];
  var dateRe=/(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/;
  var moneyRe=/(?:€|EUR|\$|PLN|zł)?\s?(\d{1,3}(?:[ .,]\d{3})*(?:[.,]\d{2})?|\d+[.,]\d{2})\s?(?:€|EUR|\$|PLN|zł)?/g;
  lines.forEach(function(l){
    var dm=l.match(dateRe);if(!dm)return;
    var date=parseDate(dm[1],dayFirst);if(!date)return;
    var nums=[],mm;moneyRe.lastIndex=0;
    while((mm=moneyRe.exec(l))!==null){var v=parseMoney(mm[1]);if(v>0)nums.push(v);}
    if(!nums.length)return;
    var amount=Math.max.apply(null,nums);
    if(amount<10)return;
    var nm=l.match(/(\d{1,2})\s*(?:noc|nights?|nocy|nocleg)/i);
    var nights=nm?+nm[1]:1;
    var guest=l.replace(dateRe,"").replace(/[€$]|EUR|PLN|zł/g,"").replace(/[\d.,]+/g," ").replace(/\s+/g," ").trim();
    guest=guest.split(" ").slice(0,3).join(" ");
    out.push({sel:true,date:date,nights:nights,amount:Math.round(amount*100)/100,
      cleaning:0,commission:0,guest:guest||"Gość z PDF"});
  });
  if(out.length)warn.push("PDF-y nie mają jednego układu — sprawdź daty i kwoty przed zatwierdzeniem.");
  return {rows:out,warnings:warn};
}
function rowsFromPDF(file,dayFirst){
  return loadPdfJs().then(function(){return file.arrayBuffer();})
    .then(function(buf){return window.pdfjsLib.getDocument({data:buf}).promise;})
    .then(function(pdf){
      var jobs=[];
      for(var p=1;p<=pdf.numPages;p++)jobs.push(pdf.getPage(p).then(function(pg){return pg.getTextContent();}));
      return Promise.all(jobs);
    }).then(function(contents){
      var lines=[];
      contents.forEach(function(c){lines=lines.concat(itemsToLines(c.items));});
      var r=rowsFromLines(lines,dayFirst);r.text=lines.join("\n");return r;
    });
}
function markDuplicates(rows){
  var have={};
  S.reservations.forEach(function(r){have[r.date+"|"+Math.round(n(r.amount)*100)]=true;});
  rows.forEach(function(row){
    row.dup=!!have[row.date+"|"+Math.round(row.amount*100)];
    if(row.dup)row.sel=false;
  });
  return rows;
}
function openImport(result,source,fileName,rawText,fromSheet){
  UI.imp={source:source,file:fileName,rows:markDuplicates(result.rows||[]),
    warnings:result.warnings||[],text:rawText||result.text||"",
    dayFirst:UI.imp?UI.imp.dayFirst:false,busy:false,error:null,fromSheet:!!fromSheet};
  UI.sheet=false;UI.form=null;render();
}
function handleImportFile(file,fromSheet){
  var name=(file.name||"").toLowerCase(),dayFirst=UI.imp?UI.imp.dayFirst:false;
  UI.imp={source:"…",file:file.name,rows:[],warnings:[],text:"",dayFirst:dayFirst,
    busy:true,error:null,fromSheet:!!fromSheet};
  UI.sheet=false;UI.form=null;render();
  if(name.endsWith(".pdf")||file.type==="application/pdf"){
    rowsFromPDF(file,dayFirst).then(function(r){openImport(r,"PDF",file.name,null,fromSheet);})
      .catch(function(err){
        UI.imp={source:"PDF",file:file.name,rows:[],warnings:[],text:"",dayFirst:dayFirst,
          busy:false,error:err.message,fromSheet:!!fromSheet};
        render();
      });
    return;
  }
  var rd=new FileReader();
  rd.onload=function(){openImport(rowsFromCSV(String(rd.result),dayFirst),"CSV",file.name,String(rd.result),fromSheet);};
  rd.onerror=function(){
    UI.imp={source:"CSV",file:file.name,rows:[],warnings:[],text:"",dayFirst:dayFirst,
      busy:false,error:"Nie udało się odczytać pliku.",fromSheet:!!fromSheet};
    render();
  };
  rd.readAsText(file,"utf-8");
}

function backupBlob(){return new Blob([JSON.stringify(S,null,2)],{type:"application/json"});}
function backupName(){return "rental-"+todayISO()+".json";}
function downloadBackup(){
  var url=URL.createObjectURL(backupBlob()),a=document.createElement("a");
  a.href=url;a.download=backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  UI.msg={ok:true,text:"Plik trafił do Pobranych."};render();
}
function shareBackup(){
  try{
    var file=new File([backupBlob()],backupName(),{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Kopia danych"})
        .then(function(){UI.msg={ok:true,text:"Kopia wysłana."};render();}).catch(function(){});
      return;
    }
  }catch(e){}
  downloadBackup();
}
function applyBackupText(text){
  try{
    var parsed=normalize(JSON.parse(text));
    if(!parsed)throw new Error("zły format");
    S=parsed;UI.paste="";UI.month=curMonth();
    UI.msg={ok:true,text:"Wczytano "+S.reservations.length+" rezerwacji."};save();render();
  }catch(err){
    UI.msg={ok:false,text:"Nie udało się odczytać pliku."};render();
  }
}

function setPath(path,value){
  if(path.indexOf("__")===0){
    if(path==="__extraAmount")UI.extra.amount=value;
    else if(path==="__extraNote")UI.extra.note=value;
    else if(path==="__paste")UI.paste=value;
    else if(path==="__costName")UI.newCost.name=value;
    else if(path==="__costAmount")UI.newCost.amount=value;
    else if(path.indexOf("__form.")===0)UI.form[path.slice(7)]=value;
    else if(path.indexOf("__imp.")===0&&UI.imp){
      var p=path.split("."),row=UI.imp.rows[+p[1]];
      if(row)row[p[2]]=n(value);
    }
    return false;
  }
  var parts=path.split("."),obj=S;
  for(var i=0;i<parts.length-1;i++)obj=obj[parts[i]];
  var last=parts[parts.length-1];
  var numeric=["amount","management","rate","standing","ibiAnnual","taxRate","prev","curr","invoice"];
  obj[last]=numeric.indexOf(last)>=0?(value===""?null:n(value)):value;
  /* Zmiana kwoty kosztu stałego w konkretnym miesiącu = świadome odstępstwo.
     Od tej chwili ta pozycja nie nadąża już za Ustawieniami. */
  if(last==="amount"&&path.indexOf(".costs.")>-1)obj.custom=true;
  return true;
}

function commitReservation(){
  var f=UI.form,amount=n(f.amount),nights=n(f.nights);
  if(!amount){f.error="Wpisz przychód brutto.";render();return null;}
  if(!nights){f.error="Podaj liczbę nocy.";render();return null;}
  var payload={date:f.date,nights:nights,amount:amount,
    cleaning:n(f.cleaning),commission:n(f.commission),
    guest:(f.guest||"").trim()||"Gość"};
  if(f.editId){
    S.reservations=S.reservations.map(function(r){return r.id===f.editId?Object.assign({},r,payload):r;});
  }else{
    S.reservations=S.reservations.concat([Object.assign({id:uid()},payload)]);
  }
  S.reservations.sort(function(a,b){return a.date.localeCompare(b.date);});
  save();
  return payload;
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(!t)return;
  var act=t.getAttribute("data-act"),val=t.getAttribute("data-val"),id=t.getAttribute("data-id");

  switch(act){
    case "tab": UI.tab=val;UI.msg=null;render(); break;
    case "prev-month": UI.month=shiftMonth(UI.month,-1);render(); break;
    case "next-month": UI.month=shiftMonth(UI.month,1);render(); break;
    case "this-month": UI.month=curMonth();render(); break;
    case "go-month": UI.month=val;UI.tab="month";render(); break;
    case "year": UI.month=shiftMonth(UI.month,12*(+val));render(); break;
    case "toggle-all": UI.showAll=!UI.showAll;render(); break;
    case "toast-action": if(val){UI.month=val;UI.tab="month";} UI.toast=null;render(); break;
    case "toast-close": UI.toast=null;renderToast(); break;

    /* koszty stałe */
    case "add-recurring":
      var nm=(UI.newCost.name||"").trim();
      if(!nm)return toast("Nazwij nowy koszt stały.");
      S.settings.recurring.push({id:uid(),name:nm,amount:n(UI.newCost.amount)});
      UI.newCost={name:"",amount:""};
      // dopisz od razu do bieżącego i przyszłych miesięcy
      ensureMonth(UI.month);
      save();toast("Dodano „"+nm+"” — będzie naliczany co miesiąc.");render();
      break;
    case "del-recurring":
      var rid=S.settings.recurring[+val].id;
      S.settings.recurring.splice(+val,1);
      Object.keys(S.months).forEach(function(mk){
        S.months[mk].costs=(S.months[mk].costs||[]).filter(function(c){return c.id!==rid;});
      });
      save();render();
      break;
    case "reset-fixed":
      var mm2=ensureMonth(UI.month);
      mm2.costs=S.settings.recurring.map(function(c){
        return {id:c.id,name:c.name,amount:n(c.amount),custom:false};
      });
      save();toast("Przywrócono kwoty z Ustawień.");render();
      break;
    case "unlock-cost":
      var mc=ensureMonth(UI.month),item=mc.costs[+val];
      if(item){
        var srcItem=S.settings.recurring.filter(function(x){return x.id===item.id;})[0];
        item.custom=false;
        if(srcItem)item.amount=n(srcItem.amount);
        save();toast("„"+item.name+"” znów nadąża za Ustawieniami.");render();
      }
      break;
    case "apply-all":
      if(!confirm("Ustawić kwoty z Ustawień we wszystkich miesiącach, także minionych? Ręczne zmiany zostaną nadpisane."))return;
      var applied=0;

      break;

    case "deduct":
      S.settings.deduct[val]=!S.settings.deduct[val];

        ? "Ta pozycja pomniejsza teraz podstawę opodatkowania."

      var sn=commitReservation();
      if(!sn)return;
      var mk2=mKey(sn.date);
      UI.form={editId:null,amount:"",nights:5,customNights:false,date:sn.date,
        cleaning:"",commission:"",guest:"",error:""};
      toast("Zapisano „"+sn.guest+"”. Łącznie w "+mName(mk2)+": "+staysIn(mk2).length+".");
      render();
      break;
    case "close-sheet": UI.sheet=false;UI.form=null;render(); break;
    case "nights": UI.form.nights=+val;UI.form.customNights=false;render(); break;
    case "nights-custom": UI.form.customNights=!UI.form.customNights;render(); break;
    case "date": UI.form.date=val;render(); break;

    /* import */
    case "close-import":
      var back=UI.imp&&UI.imp.fromSheet;
      UI.imp=null;
      if(back){
        UI.form={editId:null,amount:"",nights:5,customNights:false,date:todayISO(),
          cleaning:"",commission:"",guest:"",error:""};
        UI.sheet=true;
      }
      render();
      break;
    case "imp-toggle":
      var rr=UI.imp.rows[+val];
      if(rr)rr.sel=!rr.sel;
      render();
      break;
    case "imp-all": UI.imp.rows.forEach(function(r){r.sel=(val==="1");});render(); break;
    case "imp-dayfirst":
      UI.imp.dayFirst=!UI.imp.dayFirst;
      if(UI.imp.text){
        var again=UI.imp.source==="CSV"
          ? rowsFromCSV(UI.imp.text,UI.imp.dayFirst)
          : rowsFromLines(UI.imp.text.split("\n"),UI.imp.dayFirst);
        UI.imp.rows=markDuplicates(again.rows);
        UI.imp.warnings=again.warnings;
      }
      render();
      break;
    case "imp-confirm": confirmImport(); break;

    /* kopie i offline */
    case "share-json": shareBackup(); break;
    case "download-json": downloadBackup(); break;
    case "copy-json":
      var json=JSON.stringify(S,null,2);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(function(){
          UI.msg={ok:true,text:"Kopia w schowku."};render();
        },function(){UI.msg={ok:false,text:"Schowek niedostępny — użyj „Wyślij kopię”."};render();});
      }else{UI.msg={ok:false,text:"Schowek niedostępny."};render();}
      break;
    case "paste-json": applyBackupText(UI.paste||""); break;
    case "offline-retry":
      OFFLINE={ok:false,state:"sprawdzam…",detail:"",files:0};render();offlineDiagnose();
      break;
    case "offline-refresh":
      (window.caches?caches.keys().then(function(ks){
        return Promise.all(ks.map(function(kk){return caches.delete(kk);}));
      }):Promise.resolve()).then(function(){
        return navigator.serviceWorker.getRegistrations();
      }).then(function(regs){
        return Promise.all(regs.map(function(r){return r.unregister();}));
      }).then(function(){location.reload();}).catch(function(){location.reload();});
      break;
    case "reset":
      if(confirm("Skasować wszystkie dane z tego telefonu? Nie da się tego cofnąć.")){
        localStorage.removeItem(STORE_KEY);S=seed();UI.month=curMonth();save();render();
      }
      break;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&UI.sheet&&e.target.id==="amountInput"){
    e.preventDefault();
    var b=document.querySelector('[data-act="save-res"]');
    if(b)b.click();
  }
});

/* ================================================================= */
/*  14. Tryb offline                                                  */
/* ================================================================= */

function setOffline(ok,state,detail,files){
  OFFLINE={ok:ok,state:state,detail:detail||"",files:files||0};
  if(UI.tab==="settings")render();
}
function countCached(){
  if(!window.caches)return Promise.resolve(0);
  return caches.keys().then(function(keys){
    return Promise.all(keys.map(function(kk){return caches.open(kk).then(function(c){return c.keys();});}));
  }).then(function(lists){
    return lists.reduce(function(a,l){return a+l.length;},0);
  }).catch(function(){return 0;});
}
function offlineDiagnose(){
  var loc=window.location;
  if(!("serviceWorker" in navigator)){
    setOffline(false,"Przeglądarka nie obsługuje trybu offline",
      "Tryb prywatny wyłącza service workery. Otwórz aplikację w zwykłej karcie.");
    return;
  }
  var secure=(loc.protocol==="https:")||loc.hostname==="localhost"||loc.hostname==="127.0.0.1";
  if(!secure){
    setOffline(false,"Aplikacja nie działa pod adresem HTTPS",
      (loc.protocol==="file:"||loc.protocol==="content:")
        ? "Otworzyłeś plik prosto z pamięci telefonu. Tryb offline wymaga adresu https:// — otwórz aplikację z github.io."
        : "Adres używa http:// zamiast https://.");
    return;
  }
  fetch("./sw.js",{cache:"no-store"}).then(function(res){
    var ct=(res.headers.get("content-type")||"").toLowerCase();
    if(!res.ok)throw new Error("Serwer zwrócił HTTP "+res.status+" dla sw.js. Wgraj sw.js obok index.html.");
    if(ct.indexOf("html")>-1)throw new Error("Pod adresem sw.js serwer zwraca HTML — tego pliku tam nie ma.");
    return navigator.serviceWorker.register("./sw.js");
  }).then(function(reg){
    return navigator.serviceWorker.ready.then(function(){return reg;});
  }).then(countCached).then(function(count){
    if(count>0)setOffline(true,"Działa","W pamięci podręcznej: "+count+" plików.",count);
    else setOffline(true,"Włączony, trwa pobieranie","Zostaw aplikację otwartą kilkanaście sekund przy internecie.",0);
  }).catch(function(err){
    setOffline(false,"Nie udało się włączyć",String(err.message||err));
  });
}

render();
window.addEventListener("load",offlineDiagnose);
</script>
