<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFC79A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Rental" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>Rental Tracker</title>
<style>
:root{
  --ink:#3E2430; --soft:#7A5B66; --faint:#A78A94;
  --profit:#0E7C63; --cost:#C2384F; --adr:#B4530A; --roi:#6D3FBF; --sea:#0E6E9C;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior-y:none}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Roboto","Samsung One",sans-serif;
  color:var(--ink);font-variant-numeric:tabular-nums;
  background:linear-gradient(165deg,#FFE9C2 0%,#FFC79A 26%,#FF9E86 56%,#EE7E9B 82%,#B879C9 100%);
  background-attachment:fixed;
}
#app{height:100%;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;padding:calc(var(--st) + 14px) 14px calc(100px + var(--sb));position:relative;z-index:1}
.orb{position:fixed;border-radius:999px;filter:blur(70px);pointer-events:none;z-index:0}

.card{background:rgba(255,255,255,.36);backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.55);
  border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 8px 26px rgba(120,55,45,.12),inset 0 1px 0 rgba(255,255,255,.6)}
.inset{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);border-radius:12px;padding:10px 12px}

h1{font-family:Georgia,serif;font-weight:500;letter-spacing:-.02em;margin:0;font-size:22px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:5px}
.big{font-size:34px;line-height:1.1;letter-spacing:-.03em;font-weight:500;margin:0}
.muted{color:var(--soft);font-size:12px}

input,textarea,select{font-family:inherit}
.field{width:100%;border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.field:focus{outline:none;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(109,63,191,.28)}
.field-xl{font-size:32px;font-weight:500;text-align:right;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{border:none;border-radius:12px;min-height:46px;padding:0 18px;font-size:15px;font-weight:500;cursor:pointer}
.btn:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--ink),#6A2F4C);color:#FFF3E4;box-shadow:0 6px 16px rgba(62,36,48,.28)}
.ghost{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:var(--ink)}
.del{background:none;border:none;color:var(--faint);font-size:18px;padding:8px;cursor:pointer}
.del:active{color:var(--cost)}

.chip{min-height:42px;padding:0 15px;border-radius:999px;font-size:14px;cursor:pointer;
  background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.6);color:var(--soft);
  display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.chip[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#FFF3E4;font-weight:500}
.chip:active{transform:scale(.96)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.45)}
.row:last-child{border-bottom:none}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right}

.pill{border-radius:999px;padding:4px 11px;font-size:11px;display:inline-block}
.warn{background:rgba(194,56,79,.14);color:var(--cost)}
.ok{background:rgba(14,124,99,.14);color:var(--profit)}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;padding:8px 10px calc(8px + var(--sb));background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.6)}
#tabbar button{background:none;border:none;padding:8px 0;border-radius:12px;font-size:11px;color:var(--soft);cursor:pointer}
#tabbar button[data-on="1"]{color:var(--ink);font-weight:600;background:rgba(255,255,255,.6)}
#tabbar .ico{display:block;font-size:19px;line-height:1.2}

#fab{position:fixed;right:18px;bottom:calc(88px + var(--sb));z-index:31;width:62px;height:62px;
  border:none;border-radius:999px;font-size:30px;line-height:1;color:#FFF3E4;cursor:pointer;
  background:linear-gradient(135deg,var(--ink),#6A2F4C);box-shadow:0 10px 26px rgba(62,36,48,.42)}
#fab:active{transform:scale(.94)}

#backdrop{position:fixed;inset:0;z-index:40;background:rgba(62,36,48,.32);backdrop-filter:blur(3px)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;
  padding:10px 16px calc(20px + var(--sb));border-radius:24px 24px 0 0;
  background:linear-gradient(180deg,rgba(255,244,228,.97),rgba(255,231,214,.97));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.8);box-shadow:0 -12px 40px rgba(120,55,45,.28);
  animation:up .26s cubic-bezier(.2,.8,.3,1) both}
.grabber{width:40px;height:4px;border-radius:999px;background:rgba(122,91,102,.35);margin:4px auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.hidden{display:none!important}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mt10{margin-top:10px}.mt16{margin-top:16px}
label.btn{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="orb" style="width:320px;height:320px;top:-100px;left:-80px;background:rgba(255,214,140,.8)"></div>
<div class="orb" style="width:300px;height:300px;top:260px;right:-120px;background:rgba(255,138,132,.6)"></div>
<div class="orb" style="width:340px;height:340px;bottom:-140px;left:20%;background:rgba(158,120,230,.5)"></div>

<div id="app">
  <div id="scroll"></div>
  <button id="fab" data-act="open-sheet" aria-label="Dodaj rezerwację">+</button>
  <nav id="tabbar"></nav>
</div>
<div id="modal"></div>

<script>
"use strict";

/* ================================================================= */
/*  1. Narzędzia                                                      */
/* ================================================================= */

var MS=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
var ML=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];

function n(v){var x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:0;}
function eur(v,d){d=d||0;return new Intl.NumberFormat("pl-PL",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(isFinite(v)?v:0);}
function pct(v,d){d=d==null?0:d;return ((isFinite(v)?v*100:0).toFixed(d).replace(".",","))+"%";}
function num(v,d){d=d==null?1:d;return isFinite(v)?v.toFixed(d).replace(".",","):"—";}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return iso(new Date());}
function yesterdayISO(){return iso(new Date(Date.now()-864e5));}
function curMonth(){return todayISO().slice(0,7);}
function mKey(x){return String(x).slice(0,7);}
function mName(k){var p=k.split("-");return ML[+p[1]-1]+" "+p[0];}
function mShort(k){var p=k.split("-");return MS[+p[1]-1]+" "+p[0].slice(2);}
function daysIn(k){var p=k.split("-");return new Date(+p[0],+p[1],0).getDate();}
function shiftMonth(k,d){var p=k.split("-");var x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");}
function dayLabel(x){var p=x.split("-");return (+p[2])+" "+MS[+p[1]-1];}

/* ================================================================= */
/*  2. Dane                                                           */
/*                                                                    */
/*  Wszystkie koszty wpisywane ręcznie. Aplikacja niczego nie mnoży   */
/*  ani nie podstawia z domyślnych stawek — sumuje to, co wpiszesz.   */
/* ================================================================= */

var STORE_KEY="rental-tracker-mobile-v1";

var CATS=[
  {id:"repairs",label:"Naprawy",color:"#C2384F"},
  {id:"supplies",label:"Zakupy",color:"#6D3FBF"},
  {id:"cleaning_extra",label:"Sprzątanie extra",color:"#0E6E9C"},
  {id:"utilities",label:"Media",color:"#B4530A"},
  {id:"other",label:"Inne",color:"#7A5B66"}
];
function catOf(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i];}return CATS[4];}

var DEFAULTS={
  fixed:{comunidad:145,internet:35,ochrona:25},
  electricity:{rate:.24,standing:12},
  water:{rate:2.1,standing:8},
  ibiAnnual:696, taxRate:19
};

function seed(){
  var m0=curMonth(), m1=shiftMonth(m0,-1), m2=shiftMonth(m0,-2);
  var d=function(k,x){return k+"-"+String(x).padStart(2,"0");};
  var months={};
  months[m2]={fixed:{comunidad:145,internet:35,ochrona:25},management:180,
    electricity:{mode:"meter",prev:4180,curr:4402,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:796,curr:812,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"repairs",amount:240,note:"Serwis klimatyzacji"}]};
  months[m1]={fixed:{comunidad:145,internet:35,ochrona:25},management:265,
    electricity:{mode:"meter",prev:4402,curr:4715,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:812,curr:835,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"supplies",amount:320,note:"Pościel i ręczniki"}]};
  months[m0]={fixed:{comunidad:145,internet:35,ochrona:25},management:null,
    electricity:{mode:"meter",prev:4715,curr:null,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:835,curr:null,rate:2.1,standing:8,invoice:null},
    extras:[]};
  return {
    schema:2,
    property:{name:"Apartament",city:"Marbella",area:"Puerto Banús",country:"Hiszpania"},
    settings:JSON.parse(JSON.stringify(DEFAULTS)),
    reservations:[
      {id:uid(),date:d(m1,2),nights:8,amount:1760,cleaning:70,commission:52.8,guest:"Bennett (UK)"},
      {id:uid(),date:d(m1,13),nights:7,amount:1610,cleaning:60,commission:48.3,guest:"García (ES)"},
      {id:uid(),date:d(m1,24),nights:6,amount:1440,cleaning:60,commission:43.2,guest:"Schmidt (DE)"},
      {id:uid(),date:d(m0,3),nights:5,amount:1000,cleaning:55,commission:30,guest:"Jensen (DK)"},
      {id:uid(),date:d(m0,12),nights:4,amount:760,cleaning:55,commission:22.8,guest:"Nowak (PL)"}
    ],
    months:months
  };
}

function normalize(d){
  if(!d||typeof d!=="object")return null;
  var s=d.settings||{};
  var months=(d.months&&typeof d.months==="object")?d.months:{};
  // Kopie z wersji 1 nie miały pozycji „zarządzanie" — dopisujemy ją jako pustą.
  Object.keys(months).forEach(function(k){
    if(months[k]&&months[k].management===undefined)months[k].management=null;
  });
  return {
    schema:2,
    property:Object.assign({name:"Apartament",city:"",area:"",country:""},d.property||{}),
    settings:Object.assign({},DEFAULTS,{
      fixed:Object.assign({},DEFAULTS.fixed,s.fixed||{}),
      electricity:Object.assign({},DEFAULTS.electricity,s.electricity||{}),
      water:Object.assign({},DEFAULTS.water,s.water||{}),
      ibiAnnual:s.ibiAnnual!==undefined?s.ibiAnnual:DEFAULTS.ibiAnnual,
      taxRate:s.taxRate!==undefined?s.taxRate:DEFAULTS.taxRate
    }),
    reservations:Array.isArray(d.reservations)?d.reservations:[],
    months:months
  };
}

function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(!raw)return seed();
    return normalize(JSON.parse(raw))||seed();
  }catch(e){console.error(e);return seed();}
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}
    catch(e){alert("Nie udało się zapisać danych: "+e.message);}
  },200);
}

var S=load();
var UI={tab:"month",month:curMonth(),sheet:null,form:null,extra:{category:"repairs",amount:"",note:""},msg:null,paste:""};

/* ================================================================= */
/*  3. Obliczenia                                                     */
/* ================================================================= */

function emptyMonth(prev){
  var s=S.settings;
  return {
    fixed:Object.assign({},s.fixed),
    // prowizja za zarządzanie: przenosimy ostatnio wpisaną kwotę jako punkt wyjścia,
    // ale nic nie jest liczone procentowo — wartość zawsze potwierdzasz ręcznie
    management:(prev&&prev.management!=null)?prev.management:null,
    electricity:{mode:"meter",prev:(prev&&prev.electricity)?prev.electricity.curr:null,curr:null,rate:s.electricity.rate,standing:s.electricity.standing,invoice:null},
    water:{mode:"meter",prev:(prev&&prev.water)?prev.water.curr:null,curr:null,rate:s.water.rate,standing:s.water.standing,invoice:null},
    extras:[]
  };
}
function ensureMonth(k){
  if(!S.months[k]){S.months[k]=emptyMonth(S.months[shiftMonth(k,-1)]);}
  if(S.months[k].management===undefined)S.months[k].management=null;
  return S.months[k];
}
function utilityCost(u){
  if(!u)return {cost:0,usage:0,ready:false};
  if(u.mode==="invoice"){
    var r=u.invoice!==null&&u.invoice!=="";
    return {cost:r?n(u.invoice):0,usage:0,ready:r};
  }
  var ready=u.curr!==null&&u.curr!==""&&u.prev!==null&&u.prev!=="";
  if(!ready)return {cost:0,usage:0,ready:false};
  var usage=Math.max(0,n(u.curr)-n(u.prev));
  return {cost:usage*n(u.rate)+n(u.standing),usage:usage,ready:true};
}
function summary(k){
  var m=ensureMonth(k), s=S.settings;
  var stays=S.reservations.filter(function(r){return mKey(r.date)===k;});
  var revenue=0,nights=0,cleaning=0,commission=0;
  stays.forEach(function(r){revenue+=n(r.amount);nights+=n(r.nights);cleaning+=n(r.cleaning);commission+=n(r.commission);});
  var elec=utilityCost(m.electricity), water=utilityCost(m.water);
  var utilities=elec.cost+water.cost;
  var fixed=n(m.fixed&&m.fixed.comunidad)+n(m.fixed&&m.fixed.internet)+n(m.fixed&&m.fixed.ochrona);
  var management=n(m.management);
  var ibi=n(s.ibiAnnual)/12;
  var extras=(m.extras||[]).reduce(function(a,e){return a+n(e.amount);},0);
  var costs=fixed+management+ibi+utilities+cleaning+commission+extras;
  var net=revenue-costs;
  // Podstawa opodatkowania: przychód minus koszty udokumentowane
  var taxBase=Math.max(0,revenue-(cleaning+utilities+fixed+management+ibi));
  var tax=taxBase*(n(s.taxRate)/100);
  var missing=[];
  if(!elec.ready)missing.push("prąd");
  if(!water.ready)missing.push("woda");
  if(m.management==null)missing.push("zarządzanie");
  return {key:k,label:mShort(k),month:m,stays:stays,revenue:revenue,nights:nights,cleaning:cleaning,
    commission:commission,elec:elec,water:water,utilities:utilities,fixed:fixed,management:management,
    ibi:ibi,extras:extras,costs:costs,net:net,tax:tax,netAfterTax:net-tax,
    adr:nights?revenue/nights:0,occupancy:nights/daysIn(k),
    utilitiesPerNight:nights?utilities/nights:0,
    cleaningPerStay:stays.length?cleaning/stays.length:0,
    missing:missing,complete:missing.length===0};
}
function series(endKey,count){
  var out=[];
  for(var i=count-1;i>=0;i--)out.push(summary(shiftMonth(endKey,-i)));
  return out;
}
function ytd(endKey){
  var p=endKey.split("-"),y=+p[0],mm=+p[1],rows=[];
  for(var i=1;i<=mm;i++)rows.push(summary(y+"-"+String(i).padStart(2,"0")));
  var add=function(k){return rows.reduce(function(a,r){return a+r[k];},0);};
  var nights=add("nights"),revenue=add("revenue");
  return {year:y,revenue:revenue,costs:add("costs"),net:add("net"),tax:add("tax"),
    netAfterTax:add("netAfterTax"),nights:nights,cleaning:add("cleaning"),
    management:add("management"),utilities:add("utilities"),
    adr:nights?revenue/nights:0,utilitiesPerNight:nights?add("utilities")/nights:0};
}

/* ================================================================= */
/*  4. Widoki                                                         */
/* ================================================================= */

function line(label,value,opt){
  opt=opt||{};
  return '<div class="row"><span class="grow" style="color:'+(opt.strong?"var(--ink)":"var(--soft)")+';font-size:'+(opt.strong?15:14)+'px">'+
    esc(label)+(opt.hint?' <span class="muted">'+esc(opt.hint)+'</span>':'')+
    '</span><span style="color:'+(opt.color||"var(--ink)")+';font-weight:'+(opt.strong?600:400)+';font-size:'+(opt.strong?17:15)+'px">'+value+'</span></div>';
}
function field(bind,val,suffix,attrs){
  return '<div style="position:relative">'+
    '<input class="field" type="text" inputmode="decimal" data-bind="'+bind+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+' />'+
    (suffix?'<span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none">'+esc(suffix)+'</span>':'')+
    '</div>';
}

function viewMonth(){
  var k=UI.month, sm=summary(k);
  var netColor=sm.net>=0?"var(--profit)":"var(--cost)";
  var h='';

  h+='<div class="row" style="border:none;padding:0 0 12px">'+
    '<button class="btn ghost" data-act="prev-month" aria-label="Poprzedni miesiąc">‹</button>'+
    '<div class="grow" style="text-align:center"><h1 style="text-transform:capitalize">'+mName(k)+'</h1>'+
    (k!==curMonth()?'<button class="btn" style="background:none;min-height:auto;padding:2px;font-size:12px;color:var(--soft);text-decoration:underline" data-act="this-month">wróć do bieżącego</button>':'')+
    '</div>'+
    '<button class="btn ghost" data-act="next-month" aria-label="Następny miesiąc">›</button></div>';

  h+='<div class="card"><span class="eyebrow">Zysk netto</span>'+
    '<p class="big" style="color:'+netColor+'">'+eur(sm.net)+'</p>'+
    '<p class="muted mt10">po podatku '+eur(sm.netAfterTax)+' · obłożenie '+pct(sm.occupancy)+'</p>'+
    '<div class="grid2 mt10"><div class="inset"><span class="eyebrow">Przychód</span>'+
    '<div style="font-size:18px;color:var(--sea)">'+eur(sm.revenue)+'</div></div>'+
    '<div class="inset"><span class="eyebrow">Koszty</span>'+
    '<div style="font-size:18px;color:var(--cost)">'+eur(sm.costs)+'</div></div></div>'+
    '<div class="mt10">'+(sm.complete
      ?'<span class="pill ok">✓ miesiąc domknięty</span>'
      :'<span class="pill warn">do uzupełnienia: '+sm.missing.join(", ")+'</span>')+'</div></div>';

  h+='<div class="card">'+
    line("Sprzątanie","− "+eur(sm.cleaning),{hint:sm.stays.length?sm.stays.length+" × śr. "+eur(sm.cleaningPerStay):""})+
    line("Prowizje portali","− "+eur(sm.commission))+
    line("Prowizja za zarządzanie","− "+eur(sm.management),{hint:sm.month.management==null?"nie wpisano":""})+
    line("Media (prąd + woda)","− "+eur(sm.utilities),{hint:sm.nights?eur(sm.utilitiesPerNight,2)+" / noc":""})+
    line("Opłaty stałe + IBI","− "+eur(sm.fixed+sm.ibi))+
    (sm.extras>0?line("Wydatki dodatkowe","− "+eur(sm.extras)):"")+
    '</div>';

  h+='<div class="card"><div class="row" style="border:none;padding:0 0 4px"><h2 class="grow" style="margin:0">Rezerwacje</h2>'+
    '<span class="muted">'+sm.stays.length+' · '+sm.nights+' nocy</span></div>';
  if(!sm.stays.length){
    h+='<p class="muted" style="text-align:center;padding:22px 0">Brak rezerwacji w tym miesiącu.<br>Dodaj pierwszą przyciskiem +.</p>';
  }else{
    sm.stays.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(r){

function chartSVG(rows){
  var W=320,H=160,pad=18,bw=W/rows.length;
  var vals=rows.map(function(r){return r.net;});
  var max=Math.max.apply(null,vals.concat([1])), min=Math.min.apply(null,vals.concat([0]));
  var span=(max-min)||1;
  var y0=H-pad-((0-min)/span)*(H-2*pad);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="180" role="img" aria-label="Zysk netto w ostatnich 12 miesiącach">';
  s+='<line x1="0" y1="'+y0+'" x2="'+W+'" y2="'+y0+'" stroke="rgba(62,36,48,.3)" stroke-width="1"/>';
  rows.forEach(function(r,i){
    var v=r.net, hgt=Math.abs(v)/span*(H-2*pad);
    var y=v>=0?y0-hgt:y0;
    var x=i*bw+bw*.18, w=bw*.64;
    var fill=v>=0?(r.key===UI.month?"#0E7C63":"rgba(14,124,99,.5)"):"#C2384F";
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,hgt).toFixed(1)+'" rx="3" fill="'+fill+'"><title>'+r.label+": "+eur(v)+'</title></rect>';
    s+='<text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-4)+'" font-size="8" fill="#7A5B66" text-anchor="middle">'+r.label.split(" ")[0]+'</text>';
  });
  return s+'</svg>';
}

function backupBlob(){return new Blob([JSON.stringify(S,null,2)],{type:"application/json"});}
function backupName(){return "rental-"+todayISO()+".json";}
function downloadBackup(){
  var url=URL.createObjectURL(backupBlob());
  var a=document.createElement("a");
  a.href=url;a.download=backupName();
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  UI.msg={ok:true,text:"Plik trafił do Pobranych."};render();
}
function shareBackup(){
  try{
    var file=new File([backupBlob()],backupName(),{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Kopia danych — Rental Tracker"})
        .then(function(){UI.msg={ok:true,text:"Kopia wysłana."};render();})
        .catch(function(){});
      return;
    }
  }catch(e){}
  downloadBackup();
}
function applyBackupText(text){
  try{
    var parsed=normalize(JSON.parse(text));
    if(!parsed)throw new Error("zły format");
    S=parsed;UI.paste="";UI.month=curMonth();
    UI.msg={ok:true,text:"Dane wczytane."};save();render();
  }catch(err){
    UI.msg={ok:false,text:"Nie udało się odczytać pliku. Sprawdź, czy to kopia z tej aplikacji."};render();
  }
}

    electricityCost:sm.elec.ready?eur(sm.elec.cost,2):"—",

    electricityUsage:sm.elec.ready?("zużycie "+num(sm.elec.usage,1)+" kWh × "+num(n(sm.month.electricity.rate),2)+" € + "+eur(n(sm.month.electricity.standing))+" opłaty stałej"):"Wpisz stan bieżący, żeby policzyć kwotę.",

  };
  Object.keys(map).forEach(function(k){
    var el=document.querySelector('[data-live="'+k+'"]');
    if(el)el.textContent=map[k];
  });
}

function setPath(path,value){
  if(path.indexOf("__")===0){
    if(path==="__extraAmount")UI.extra.amount=value;
    else if(path==="__extraNote")UI.extra.note=value;
    else if(path==="__paste")UI.paste=value;
    else if(path.indexOf("__form.")===0)UI.form[path.slice(7)]=value;
    return false;
  }
  var parts=path.split("."),obj=S;
  for(var i=0;i<parts.length-1;i++)obj=obj[parts[i]];
  var last=parts[parts.length-1];
  var numeric=["comunidad","internet","ochrona","management","rate","standing","ibiAnnual","taxRate","prev","curr","invoice"];
  obj[last]=numeric.indexOf(last)>=0?(value===""?null:n(value)):value;
  return true;
}

document.addEventListener("input",function(e){
  var bind=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(!bind)return;
  if(setPath(bind,e.target.value))save();
  refreshLive();
});

document.addEventListener("change",function(e){
  if(e.target.id!=="fileInput"||!e.target.files||!e.target.files[0])return;
  var reader=new FileReader();
  reader.onload=function(){applyBackupText(String(reader.result));};
  reader.onerror=function(){UI.msg={ok:false,text:"Nie udało się otworzyć pliku."};render();};
  reader.readAsText(e.target.files[0]);
});

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(!t)return;
  var act=t.getAttribute("data-act"),val=t.getAttribute("data-val"),id=t.getAttribute("data-id");

  switch(act){
    case "tab": UI.tab=val;UI.msg=null;render(); break;
    case "prev-month": UI.month=shiftMonth(UI.month,-1); render(); break;
    case "next-month": UI.month=shiftMonth(UI.month,1); render(); break;
    case "this-month": UI.month=curMonth(); render(); break;

    case "mode":
      ensureMonth(UI.month)[t.getAttribute("data-kind")].mode=val; save(); render(); break;

    case "copy-fixed":
      var prev=S.months[shiftMonth(UI.month,-1)];
      if(prev){
        var cur=ensureMonth(UI.month);
        if(prev.fixed)cur.fixed=Object.assign({},prev.fixed);
        if(prev.management!=null)cur.management=prev.management;
        save();render();
      }
      break;

    case "extra-cat": UI.extra.category=val; render(); break;
    case "add-extra":
      var amt=n(UI.extra.amount);
      if(!amt)return;
      var m=ensureMonth(UI.month);
      m.extras=(m.extras||[]).concat([{id:uid(),category:UI.extra.category,
        amount:amt,note:UI.extra.note.trim()||catOf(UI.extra.category).label}]);
      UI.extra.amount="";UI.extra.note="";save();render();
      break;
    case "del-extra":
      var mm=ensureMonth(UI.month);
      mm.extras=mm.extras.filter(function(x){return x.id!==id;});
      save();render();
      break;

    case "del-res":
      S.reservations=S.reservations.filter(function(r){return r.id!==id;});
      save();render();
      break;

    case "open-sheet":
      UI.form={amount:"",nights:5,customNights:false,date:todayISO(),
        cleaning:"",commission:"",guest:"",error:""};
      UI.sheet=true;render();
      break;
    case "close-sheet": UI.sheet=false;UI.form=null;render(); break;
    case "nights": UI.form.nights=+val;UI.form.customNights=false;render(); break;
    case "nights-custom": UI.form.customNights=!UI.form.customNights;render(); break;
    case "date": UI.form.date=val;render(); break;

    case "save-res":
      var f=UI.form,amount=n(f.amount),nights=n(f.nights);
      if(!amount){f.error="Wpisz przychód brutto.";render();return;}
      if(!nights){f.error="Podaj liczbę nocy.";render();return;}
      S.reservations=S.reservations.concat([{
        id:uid(),date:f.date,nights:nights,amount:amount,
        cleaning:n(f.cleaning),commission:n(f.commission),
        guest:(f.guest||"").trim()||"Rezerwacja"
      }]).sort(function(a,b){return a.date.localeCompare(b.date);});
      UI.month=mKey(f.date);UI.sheet=false;UI.form=null;
      save();render();
      break;

    case "share-json": shareBackup(); break;
    case "download-json": downloadBackup(); break;
    case "copy-json":
      var json=JSON.stringify(S,null,2);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(function(){
          UI.msg={ok:true,text:"Kopia w schowku — wklej ją w notatkę albo maila."};render();
        },function(){
          UI.msg={ok:false,text:"Schowek niedostępny. Użyj przycisku „Wyślij kopię”."};render();
        });
      }else{
        UI.msg={ok:false,text:"Schowek niedostępny w tej przeglądarce."};render();
      }
      break;
    case "paste-json": applyBackupText(UI.paste||""); break;

    case "reset":
      if(confirm("Skasować wszystkie dane z tego telefonu? Tej operacji nie da się cofnąć.")){
        localStorage.removeItem(STORE_KEY);S=seed();UI.month=curMonth();save();render();
      }
      break;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&UI.sheet&&e.target.id==="amountInput"){
    e.preventDefault();
    var b=document.querySelector('[data-act="save-res"]');
    if(b)b.click();
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(err){
      console.log("Tryb offline niedostępny:",err.message);
    });
  });
}
</script>
</body>
</html>
