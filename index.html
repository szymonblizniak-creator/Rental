<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFC79A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Rental" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>Rental Tracker</title>
<style>
:root{
  --ink:#3E2430; --soft:#7A5B66; --faint:#A78A94;
  --profit:#0E7C63; --cost:#C2384F; --adr:#B4530A; --roi:#6D3FBF; --sea:#0E6E9C;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior-y:none}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Roboto","Samsung One",sans-serif;
  color:var(--ink);font-variant-numeric:tabular-nums;
  background:linear-gradient(165deg,#FFE9C2 0%,#FFC79A 26%,#FF9E86 56%,#EE7E9B 82%,#B879C9 100%);
  background-attachment:fixed;
}
#app{height:100%;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;padding:calc(var(--st) + 14px) 14px calc(100px + var(--sb));position:relative;z-index:1}
.orb{position:fixed;border-radius:999px;filter:blur(70px);pointer-events:none;z-index:0}

.card{background:rgba(255,255,255,.36);backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.55);
  border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 8px 26px rgba(120,55,45,.12),inset 0 1px 0 rgba(255,255,255,.6)}
.inset{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);border-radius:12px;padding:10px 12px}

h1{font-family:Georgia,serif;font-weight:500;letter-spacing:-.02em;margin:0;font-size:22px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:5px}
.big{font-size:34px;line-height:1.1;letter-spacing:-.03em;font-weight:500;margin:0}
.muted{color:var(--soft);font-size:12px}

input,textarea,select{font-family:inherit}
.field{width:100%;border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.field:focus{outline:none;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(109,63,191,.28)}
.field-xl{font-size:32px;font-weight:500;text-align:right;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{border:none;border-radius:12px;min-height:46px;padding:0 18px;font-size:15px;font-weight:500;cursor:pointer}
.btn:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--ink),#6A2F4C);color:#FFF3E4;box-shadow:0 6px 16px rgba(62,36,48,.28)}
.ghost{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:var(--ink)}
.del{background:none;border:none;color:var(--faint);font-size:18px;padding:8px;cursor:pointer}
.del:active{color:var(--cost)}

.chip{min-height:42px;padding:0 15px;border-radius:999px;font-size:14px;cursor:pointer;
  background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.6);color:var(--soft);
  display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.chip[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#FFF3E4;font-weight:500}
.chip:active{transform:scale(.96)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.45)}
.row:last-child{border-bottom:none}
.row-tap{cursor:pointer;border-radius:10px;margin:0 -6px;padding-left:6px;padding-right:6px}
.row-tap:active{background:rgba(255,255,255,.4)}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right}

.pill{border-radius:999px;padding:4px 11px;font-size:11px;display:inline-block}
.warn{background:rgba(194,56,79,.14);color:var(--cost)}
.ok{background:rgba(14,124,99,.14);color:var(--profit)}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;padding:8px 10px calc(8px + var(--sb));background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.6)}
#tabbar button{background:none;border:none;padding:8px 0;border-radius:12px;font-size:11px;color:var(--soft);cursor:pointer}
#tabbar button[data-on="1"]{color:var(--ink);font-weight:600;background:rgba(255,255,255,.6)}
#tabbar .ico{display:block;font-size:19px;line-height:1.2}

#fab{position:fixed;right:18px;bottom:calc(88px + var(--sb));z-index:31;width:62px;height:62px;
  border:none;border-radius:999px;font-size:30px;line-height:1;color:#FFF3E4;cursor:pointer;
  background:linear-gradient(135deg,var(--ink),#6A2F4C);box-shadow:0 10px 26px rgba(62,36,48,.42)}
#fab:active{transform:scale(.94)}

#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--sb));z-index:35;
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
  background:rgba(62,36,48,.94);color:#FFF3E4;font-size:14px;
  box-shadow:0 10px 30px rgba(62,36,48,.4);animation:toastIn .22s ease both}
#toast button{background:rgba(255,255,255,.18);border:none;color:#FFF3E4;border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

#backdrop{position:fixed;inset:0;z-index:40;background:rgba(62,36,48,.32);backdrop-filter:blur(3px)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;
  padding:10px 16px calc(20px + var(--sb));border-radius:24px 24px 0 0;
  background:linear-gradient(180deg,rgba(255,244,228,.97),rgba(255,231,214,.97));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.8);box-shadow:0 -12px 40px rgba(120,55,45,.28);
  animation:up .26s cubic-bezier(.2,.8,.3,1) both}
.grabber{width:40px;height:4px;border-radius:999px;background:rgba(122,91,102,.35);margin:4px auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#sheet,#toast{animation:none}}
.hidden{display:none!important}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mt10{margin-top:10px}.mt16{margin-top:16px}
label.btn{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="orb" style="width:320px;height:320px;top:-100px;left:-80px;background:rgba(255,214,140,.8)"></div>
<div class="orb" style="width:300px;height:300px;top:260px;right:-120px;background:rgba(255,138,132,.6)"></div>
<div class="orb" style="width:340px;height:340px;bottom:-140px;left:20%;background:rgba(158,120,230,.5)"></div>

<div id="app">
  <div id="scroll"></div>
  <div id="toastHost"></div>
  <button id="fab" data-act="open-sheet" aria-label="Dodaj rezerwację">+</button>
  <nav id="tabbar"></nav>
</div>
<div id="modal"></div>

<script>
"use strict";

/* ================================================================= */
/*  1. Narzędzia                                                      */
/* ================================================================= */

var MS=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
var ML=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];

function n(v){var x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:0;}
function eur(v,d){d=d||0;return new Intl.NumberFormat("pl-PL",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(isFinite(v)?v:0);}
function pct(v,d){d=d==null?0:d;return ((isFinite(v)?v*100:0).toFixed(d).replace(".",","))+"%";}
function num(v,d){d=d==null?1:d;return isFinite(v)?v.toFixed(d).replace(".",","):"—";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* Identyfikator: znacznik czasu + licznik. Dwie rezerwacje dodane w tej samej
   sekundzie nie mogą dostać tego samego id, więc żadna nie nadpisze drugiej. */
var _seq=0;
function uid(){_seq++;return Date.now().toString(36)+"-"+_seq.toString(36);}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return iso(new Date());}
function yesterdayISO(){return iso(new Date(Date.now()-864e5));}
function curMonth(){return todayISO().slice(0,7);}
function mKey(x){return String(x).slice(0,7);}
function mName(k){var p=k.split("-");return ML[+p[1]-1]+" "+p[0];}
function mShort(k){var p=k.split("-");return MS[+p[1]-1]+" "+p[0].slice(2);}
function daysIn(k){var p=k.split("-");return new Date(+p[0],+p[1],0).getDate();}
function shiftMonth(k,d){var p=k.split("-");var x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");}
function dayLabel(x){var p=x.split("-");return (+p[2])+" "+MS[+p[1]-1];}

/* ================================================================= */
/*  2. Dane — wszystkie koszty wpisywane ręcznie                      */
/* ================================================================= */

var STORE_KEY="rental-tracker-mobile-v1";

var CATS=[
  {id:"repairs",label:"Naprawy",color:"#C2384F"},
  {id:"supplies",label:"Zakupy",color:"#6D3FBF"},
  {id:"cleaning_extra",label:"Sprzątanie extra",color:"#0E6E9C"},
  {id:"utilities",label:"Media",color:"#B4530A"},
  {id:"other",label:"Inne",color:"#7A5B66"}
];
function catOf(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i];}return CATS[4];}

var DEFAULTS={
  fixed:{comunidad:145,internet:35,ochrona:25},
  electricity:{rate:.24,standing:12},
  water:{rate:2.1,standing:8},
  ibiAnnual:696, taxRate:19
};

function seed(){
  var m0=curMonth(), m1=shiftMonth(m0,-1), m2=shiftMonth(m0,-2);
  var d=function(k,x){return k+"-"+String(x).padStart(2,"0");};
  var months={};
  months[m2]={fixed:{comunidad:145,internet:35,ochrona:25},management:180,
    electricity:{mode:"meter",prev:4180,curr:4402,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:796,curr:812,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"repairs",amount:240,note:"Serwis klimatyzacji"}]};
  months[m1]={fixed:{comunidad:145,internet:35,ochrona:25},management:265,
    electricity:{mode:"meter",prev:4402,curr:4715,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:812,curr:835,rate:2.1,standing:8,invoice:null},
    extras:[{id:uid(),category:"supplies",amount:320,note:"Pościel i ręczniki"}]};
  months[m0]={fixed:{comunidad:145,internet:35,ochrona:25},management:null,
    electricity:{mode:"meter",prev:4715,curr:null,rate:.24,standing:12,invoice:null},
    water:{mode:"meter",prev:835,curr:null,rate:2.1,standing:8,invoice:null},
    extras:[]};
  return {
    schema:2,
    property:{name:"Apartament",city:"Marbella",area:"Puerto Banús",country:"Hiszpania"},
    settings:JSON.parse(JSON.stringify(DEFAULTS)),
    reservations:[
      {id:uid(),date:d(m1,2),nights:8,amount:1760,cleaning:70,commission:52.8,guest:"Bennett (UK)"},
      {id:uid(),date:d(m1,13),nights:7,amount:1610,cleaning:60,commission:48.3,guest:"García (ES)"},
      {id:uid(),date:d(m1,24),nights:6,amount:1440,cleaning:60,commission:43.2,guest:"Schmidt (DE)"},
      {id:uid(),date:d(m0,3),nights:5,amount:1000,cleaning:55,commission:30,guest:"Jensen (DK)"},
      {id:uid(),date:d(m0,12),nights:4,amount:760,cleaning:55,commission:22.8,guest:"Nowak (PL)"}
    ],
    months:months
  };
}

function normalize(d){
  if(!d||typeof d!=="object")return null;
  var s=d.settings||{};
  var months=(d.months&&typeof d.months==="object")?d.months:{};
  Object.keys(months).forEach(function(k){
    if(months[k]&&months[k].management===undefined)months[k].management=null;
  });
  var res=Array.isArray(d.reservations)?d.reservations:[];
  // Naprawa ewentualnych powtórzonych identyfikatorów ze starszych kopii
  var seen={};
  res.forEach(function(r){
    if(!r.id||seen[r.id])r.id=uid();
    seen[r.id]=true;
  });
  return {
    schema:2,
    property:Object.assign({name:"Apartament",city:"",area:"",country:""},d.property||{}),
    settings:Object.assign({},DEFAULTS,{
      fixed:Object.assign({},DEFAULTS.fixed,s.fixed||{}),
      electricity:Object.assign({},DEFAULTS.electricity,s.electricity||{}),
      water:Object.assign({},DEFAULTS.water,s.water||{}),
      ibiAnnual:s.ibiAnnual!==undefined?s.ibiAnnual:DEFAULTS.ibiAnnual,
      taxRate:s.taxRate!==undefined?s.taxRate:DEFAULTS.taxRate
    }),
    reservations:res,
    months:months
  };
}

function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(!raw)return seed();
    return normalize(JSON.parse(raw))||seed();
  }catch(e){console.error(e);return seed();}
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}
    catch(e){alert("Nie udało się zapisać danych: "+e.message);}
  },200);
}

var S=load();
var UI={tab:"month",month:curMonth(),sheet:null,form:null,showAll:false,
  extra:{category:"repairs",amount:"",note:""},msg:null,paste:"",toast:null,
  imp:null};   /* imp = podgląd importu przed zatwierdzeniem */

/* Stan trybu offline — wypełniany przez offlineDiagnose() przy starcie */
var OFFLINE={ok:false,state:"sprawdzam…",detail:"",files:0};

var toastTimer=null;
function toast(text,actionLabel,actionMonth){
  UI.toast={text:text,label:actionLabel||null,month:actionMonth||null};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){UI.toast=null;renderToast();},6000);
}

/* ================================================================= */
/*  3. Obliczenia                                                     */
/* ================================================================= */

function emptyMonth(prev){
  var s=S.settings;
  return {
    fixed:Object.assign({},s.fixed),
    management:(prev&&prev.management!=null)?prev.management:null,
    electricity:{mode:"meter",prev:(prev&&prev.electricity)?prev.electricity.curr:null,curr:null,rate:s.electricity.rate,standing:s.electricity.standing,invoice:null},
    water:{mode:"meter",prev:(prev&&prev.water)?prev.water.curr:null,curr:null,rate:s.water.rate,standing:s.water.standing,invoice:null},
    extras:[]
  };
}
function ensureMonth(k){
  if(!S.months[k]){S.months[k]=emptyMonth(S.months[shiftMonth(k,-1)]);}
  if(S.months[k].management===undefined)S.months[k].management=null;
  return S.months[k];
}
function utilityCost(u){
  if(!u)return {cost:0,usage:0,ready:false};
  if(u.mode==="invoice"){
    var r=u.invoice!==null&&u.invoice!=="";
    return {cost:r?n(u.invoice):0,usage:0,ready:r};
  }
  var ready=u.curr!==null&&u.curr!==""&&u.prev!==null&&u.prev!=="";
  if(!ready)return {cost:0,usage:0,ready:false};
  var usage=Math.max(0,n(u.curr)-n(u.prev));
  return {cost:usage*n(u.rate)+n(u.standing),usage:usage,ready:true};
}
function staysIn(k){
  return S.reservations.filter(function(r){return mKey(r.date)===k;});
}
function summary(k){
  var m=ensureMonth(k), s=S.settings;
  var stays=staysIn(k);
  var revenue=0,nights=0,cleaning=0,commission=0;
  stays.forEach(function(r){revenue+=n(r.amount);nights+=n(r.nights);cleaning+=n(r.cleaning);commission+=n(r.commission);});
  var elec=utilityCost(m.electricity), water=utilityCost(m.water);
  var utilities=elec.cost+water.cost;
  var fixed=n(m.fixed&&m.fixed.comunidad)+n(m.fixed&&m.fixed.internet)+n(m.fixed&&m.fixed.ochrona);
  var management=n(m.management);
  var ibi=n(s.ibiAnnual)/12;
  var extras=(m.extras||[]).reduce(function(a,e){return a+n(e.amount);},0);
  var costs=fixed+management+ibi+utilities+cleaning+commission+extras;
  var net=revenue-costs;
  var taxBase=Math.max(0,revenue-(cleaning+utilities+fixed+management+ibi));
  var tax=taxBase*(n(s.taxRate)/100);
  var missing=[];
  if(!elec.ready)missing.push("prąd");
  if(!water.ready)missing.push("woda");
  if(m.management==null)missing.push("zarządzanie");
  return {key:k,label:mShort(k),month:m,stays:stays,revenue:revenue,nights:nights,cleaning:cleaning,
    commission:commission,elec:elec,water:water,utilities:utilities,fixed:fixed,management:management,
    ibi:ibi,extras:extras,costs:costs,net:net,tax:tax,netAfterTax:net-tax,
    adr:nights?revenue/nights:0,occupancy:nights/daysIn(k),
    utilitiesPerNight:nights?utilities/nights:0,
    cleaningPerStay:stays.length?cleaning/stays.length:0,
    missing:missing,complete:missing.length===0};
}
function series(endKey,count){
  var out=[];
  for(var i=count-1;i>=0;i--)out.push(summary(shiftMonth(endKey,-i)));
  return out;
}
function ytd(endKey){
  var p=endKey.split("-"),y=+p[0],mm=+p[1],rows=[];
  for(var i=1;i<=mm;i++)rows.push(summary(y+"-"+String(i).padStart(2,"0")));
  var add=function(k){return rows.reduce(function(a,r){return a+r[k];},0);};
  var nights=add("nights"),revenue=add("revenue");
  return {year:y,revenue:revenue,costs:add("costs"),net:add("net"),tax:add("tax"),
    netAfterTax:add("netAfterTax"),nights:nights,cleaning:add("cleaning"),
    management:add("management"),utilities:add("utilities"),
    adr:nights?revenue/nights:0,utilitiesPerNight:nights?add("utilities")/nights:0};
}

/* ================================================================= */
/*  4. Widoki                                                         */
/* ================================================================= */

function line(label,value,opt){
  opt=opt||{};
  return '<div class="row"><span class="grow" style="color:'+(opt.strong?"var(--ink)":"var(--soft)")+';font-size:'+(opt.strong?15:14)+'px">'+
    esc(label)+(opt.hint?' <span class="muted">'+esc(opt.hint)+'</span>':'')+
    '</span><span style="color:'+(opt.color||"var(--ink)")+';font-weight:'+(opt.strong?600:400)+';font-size:'+(opt.strong?17:15)+'px">'+value+'</span></div>';
}
function field(bind,val,suffix,attrs){
  return '<div style="position:relative">'+
    '<input class="field" type="text" inputmode="decimal" data-bind="'+bind+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+' />'+
    (suffix?'<span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none">'+esc(suffix)+'</span>':'')+
    '</div>';
}

/* Wiersz rezerwacji — tapnięcie otwiera edycję, kosz pyta o potwierdzenie */
function resRow(r,showMonth){
  var netStay=n(r.amount)-n(r.cleaning)-n(r.commission);
  return '<div class="row row-tap" data-act="edit-res" data-id="'+r.id+'">'+
    '<div class="grow"><div class="trunc">'+esc(r.guest)+'</div>'+
    '<div class="muted">'+(showMonth?mShort(mKey(r.date))+' · ':'')+dayLabel(r.date)+' · '+r.nights+' nocy · sprzątanie '+eur(r.cleaning)+' · prowizja '+eur(r.commission)+'</div></div>'+
    '<div class="right"><div>'+eur(r.amount)+'</div>'+
    '<div class="muted" style="color:var(--profit)">netto '+eur(netStay)+'</div></div>'+
    '<button class="del" data-act="del-res" data-id="'+r.id+'" aria-label="Usuń rezerwację '+esc(r.guest)+'">🗑</button></div>';
}

function viewMonth(){
  var k=UI.month, sm=summary(k);
  var netColor=sm.net>=0?"var(--profit)":"var(--cost)";
  var total=S.reservations.length;
  var h='';

  h+='<div class="row" style="border:none;padding:0 0 12px">'+
    '<button class="btn ghost" data-act="prev-month" aria-label="Poprzedni miesiąc">‹</button>'+
    '<div class="grow" style="text-align:center"><h1 style="text-transform:capitalize">'+mName(k)+'</h1>'+
    (k!==curMonth()?'<button class="btn" style="background:none;min-height:auto;padding:2px;font-size:12px;color:var(--soft);text-decoration:underline" data-act="this-month">wróć do bieżącego</button>':'')+

function chartSVG(rows){
  var W=320,H=160,pad=18,bw=W/rows.length;
  var vals=rows.map(function(r){return r.net;});
  var max=Math.max.apply(null,vals.concat([1])), min=Math.min.apply(null,vals.concat([0]));
  var span=(max-min)||1;
  var y0=H-pad-((0-min)/span)*(H-2*pad);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="180" role="img" aria-label="Zysk netto w ostatnich 12 miesiącach">';
  s+='<line x1="0" y1="'+y0+'" x2="'+W+'" y2="'+y0+'" stroke="rgba(62,36,48,.3)" stroke-width="1"/>';
  rows.forEach(function(r,i){
    var v=r.net, hgt=Math.abs(v)/span*(H-2*pad);
    var y=v>=0?y0-hgt:y0;
    var x=i*bw+bw*.18, w=bw*.64;
    var fill=v>=0?(r.key===UI.month?"#0E7C63":"rgba(14,124,99,.5)"):"#C2384F";
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,hgt).toFixed(1)+'" rx="3" fill="'+fill+'"><title>'+r.label+": "+eur(v)+'</title></rect>';
    s+='<text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-4)+'" font-size="8" fill="#7A5B66" text-anchor="middle">'+r.label.split(" ")[0]+'</text>';
  });
  return s+'</svg>';
}

    '<input class="field" type="text" data-bind="__form.guest" value="'+esc(f.guest)+'" placeholder="Nazwisko / kraj" /></div>';

/* ================================================================= */
/*  6. Import plików: CSV z Airbnb i PDF z rozliczeniem               */
/*                                                                    */
/*  Nic nie trafia do bazy automatycznie. Plik jest tylko czytany,    */
/*  a wykryte pozycje lądują w podglądzie do zatwierdzenia.           */
/* ================================================================= */

/* ---------- liczby i daty w różnych formatach ---------- */

/** "1 234,56 €", "$1,234.56", "1.234,56" → 1234.56 */
function parseMoney(raw){
  if(raw==null)return 0;
  var s=String(raw).replace(/[^\d,.\-]/g,"").trim();
  if(!s)return 0;
  var lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
  if(lastComma>-1&&lastDot>-1){
    // ten separator, który stoi dalej, jest dziesiętny
    if(lastComma>lastDot){s=s.replace(/\./g,"").replace(",",".");}
    else{s=s.replace(/,/g,"");}
  }else if(lastComma>-1){
    // pojedynczy przecinek: „1,234" to tysiące, „1,23" to część dziesiętna
    s=(s.length-lastComma===4)?s.replace(",",""):s.replace(",",".");
  }else if(lastDot>-1){
    if(s.length-lastDot===4&&s.split(".").length===2&&s.indexOf("-")<0&&s.length>5)s=s.replace(".","");
  }
  var v=parseFloat(s);
  return isFinite(v)?v:0;
}

/** Zwraca ISO yyyy-mm-dd albo null. dayFirst przełącza odczyt 03/04 jako 3 kwietnia. */
function parseDate(raw,dayFirst){
  if(!raw)return null;
  var s=String(raw).trim();
  var m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");

  m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if(m){
    var a=+m[1],b=+m[2],y=+m[3];
    if(y<100)y+=2000;
    var day,mon;
    if(a>12){day=a;mon=b;}          // 25/03 — jednoznaczne
    else if(b>12){mon=a;day=b;}     // 03/25 — jednoznaczne
    else if(s.indexOf(".")>-1){day=a;mon=b;}  // zapis z kropkami to u nas DD.MM
    else if(dayFirst){day=a;mon=b;}
    else{mon=a;day=b;}              // Airbnb po angielsku eksportuje MM/DD/YYYY
    if(mon<1||mon>12||day<1||day>31)return null;
    return y+"-"+String(mon).padStart(2,"0")+"-"+String(day).padStart(2,"0");
  }
  var d=new Date(s);
  return isNaN(d.getTime())?null:iso(d);
}

function nightsBetween(a,b){
  if(!a||!b)return 0;
  var d=(new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5;
  return d>0&&d<400?Math.round(d):0;
}

/* ---------- CSV ---------- */

/** Parser radzący sobie z cudzysłowami, przecinkami w polach i podwójnym "" */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  var head=text.slice(0,text.indexOf("\n")>-1?text.indexOf("\n"):text.length);
  var delim=(head.split(";").length>head.split(",").length)?";":",";
  var rows=[],row=[],val="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; }
      else val+=c;
    }else{
      if(c==='"')q=true;
      else if(c===delim){row.push(val);val="";}
      else if(c==="\n"){row.push(val);rows.push(row);row=[];val="";}
      else if(c!=="\r")val+=c;
    }
  }
  if(val!==""||row.length){row.push(val);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=="";});});
}

/** Dopasowanie kolumn po nazwie — działa dla eksportów PL i EN */
var CSV_MAP=[
  {key:"start",  names:["start date","check-in","checkin","data przyjazdu","data rozpoczęcia","przyjazd","zameldowanie","start"]},
  {key:"end",    names:["end date","check-out","checkout","data wyjazdu","data zakończenia","wyjazd","koniec"]},
  {key:"nights", names:["# of nights","nights","liczba nocy","noce","noclegi"]},
  {key:"amount", names:["gross earnings","earnings","amount","payout","kwota","przychód","zarobki","wartość"]},
  {key:"host",   names:["host fee","service fee","host service fee","prowizja","opłata za usługę"]},
  {key:"clean",  names:["cleaning fee","cleaning","sprzątanie","opłata za sprzątanie"]},
  {key:"guest",  names:["guest name","guest","gość","imię gościa","nazwa gościa"]},
  {key:"type",   names:["type","typ","rodzaj"]},
  {key:"code",   names:["confirmation code","kod potwierdzenia","kod rezerwacji"]}
];

function mapHeader(header){
  var idx={};
  header.forEach(function(cell,i){
    var name=String(cell).toLowerCase().trim();
    CSV_MAP.forEach(function(def){
      if(idx[def.key]!==undefined)return;
      for(var j=0;j<def.names.length;j++){
        if(name===def.names[j]||name.indexOf(def.names[j])>-1){idx[def.key]=i;return;}
      }
    });
  });
  return idx;
}

function rowsFromCSV(text,dayFirst){
  var rows=parseCSV(text);
  if(rows.length<2)return {rows:[],warnings:["Plik nie zawiera danych."]};

  // nagłówek bywa poprzedzony wierszami opisowymi — szukamy pierwszego z sensownymi kolumnami
  var headerIdx=-1,idx=null;
  for(var i=0;i<Math.min(rows.length,8);i++){
    var candidate=mapHeader(rows[i]);
    if(candidate.start!==undefined&&(candidate.amount!==undefined||candidate.nights!==undefined)){
      headerIdx=i;idx=candidate;break;
    }
  }
  if(headerIdx<0)return {rows:[],warnings:["Nie rozpoznałem kolumn. Potrzebna jest przynajmniej data przyjazdu i kwota."]};

  var out=[],warn=[],skipped=0;
  for(var r=headerIdx+1;r<rows.length;r++){
    var c=rows[r];
    var get=function(k){return idx[k]!==undefined?c[idx[k]]:"";};

    // w historii transakcji odrzucamy wiersze nie będące rezerwacją
    var type=String(get("type")).toLowerCase();
    if(type&&/payout|wypłata|adjustment|korekta|refund|zwrot/.test(type)){skipped++;continue;}

    var start=parseDate(get("start"),dayFirst);
    if(!start){skipped++;continue;}
    var nights=n(get("nights"))||nightsBetween(start,parseDate(get("end"),dayFirst))||1;
    var amount=parseMoney(get("amount"));
    if(!amount){skipped++;continue;}

    out.push({
      sel:true,
      date:start,
      nights:nights,
      amount:Math.round(amount*100)/100,
      cleaning:Math.round(parseMoney(get("clean"))*100)/100,
      commission:Math.round(Math.abs(parseMoney(get("host")))*100)/100,
      guest:String(get("guest")||get("code")||"Gość z importu").trim()||"Gość z importu"
    });
  }
  if(skipped)warn.push("Pominięto "+skipped+" wierszy bez daty lub kwoty (np. wypłaty, korekty).");
  if(idx.clean===undefined)warn.push("Brak kolumny ze sprzątaniem — kwoty trzeba uzupełnić ręcznie.");
  if(idx.host===undefined)warn.push("Brak kolumny z prowizją portalu — uzupełnij ją ręcznie.");
  return {rows:out,warnings:warn};
}

/* ---------- PDF ---------- */

var pdfjsPromise=null;
/** pdf.js dociągamy dopiero przy pierwszym imporcie PDF; potem siedzi w cache offline. */
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise)return pdfjsPromise;
  pdfjsPromise=new Promise(function(resolve,reject){
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=function(){
      if(!window.pdfjsLib)return reject(new Error("brak pdfjsLib"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror=function(){reject(new Error("Nie udało się pobrać czytnika PDF. Potrzebny internet przy pierwszym imporcie."));};
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}

/** Zamienia elementy tekstowe PDF na linie, grupując je po współrzędnej pionowej. */
function itemsToLines(items){
  var buckets={};
  items.forEach(function(it){
    var y=Math.round(it.transform[5]);
    (buckets[y]=buckets[y]||[]).push({x:it.transform[4],s:it.str});
  });
  return Object.keys(buckets)
    .sort(function(a,b){return b-a;})
    .map(function(y){
      return buckets[y].sort(function(a,b){return a.x-b.x;})
        .map(function(o){return o.s;}).join(" ").replace(/\s+/g," ").trim();
    })
    .filter(function(l){return l.length>0;});
}

function rowsFromLines(lines,dayFirst){
  var out=[],warn=[];
  var dateRe=/(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/;
  var moneyRe=/(?:€|EUR|\$|PLN|zł)?\s?(\d{1,3}(?:[ .,]\d{3})*(?:[.,]\d{2})?|\d+[.,]\d{2})\s?(?:€|EUR|\$|PLN|zł)?/g;

  lines.forEach(function(l){
    var dm=l.match(dateRe);
    if(!dm)return;
    var date=parseDate(dm[1],dayFirst);
    if(!date)return;

    // kwoty w linii: bierzemy największą jako przychód pobytu
    var nums=[],mm;
    moneyRe.lastIndex=0;
    while((mm=moneyRe.exec(l))!==null){
      var v=parseMoney(mm[1]);
      if(v>0)nums.push(v);
    }
    if(!nums.length)return;
    var amount=Math.max.apply(null,nums);
    if(amount<10)return; // za małe, żeby było przychodem z pobytu

    var nightsMatch=l.match(/(\d{1,2})\s*(?:noc|nights?|nocy|nocleg)/i);
    var nights=nightsMatch?+nightsMatch[1]:0;
    if(!nights){
      var second=l.match(dateRe.source+"[\\s\\S]*?"+dateRe.source);
      if(second){
        var d2=parseDate(String(second[0]).split(/\s+/).pop(),dayFirst);
        nights=nightsBetween(date,d2);
      }
    }

    // nazwa gościa: pierwszy fragment tekstowy bez cyfr i walut
    var guest=l.replace(dateRe,"").replace(/[€$]|EUR|PLN|zł/g,"")
      .replace(/[\d.,]+/g," ").replace(/\s+/g," ").trim();
    guest=guest.split(" ").slice(0,3).join(" ");

    out.push({
      sel:true,date:date,nights:nights||1,
      amount:Math.round(amount*100)/100,
      cleaning:0,commission:0,
      guest:guest||"Gość z PDF"
    });
  });

  if(out.length)warn.push("PDF-y nie mają jednego układu — sprawdź daty, liczbę nocy i kwoty przed zatwierdzeniem.");
  return {rows:out,warnings:warn};
}

function rowsFromPDF(file,dayFirst){
  return loadPdfJs().then(function(pdfjsLib){
    return file.arrayBuffer();
  }).then(function(buf){
    return window.pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    var jobs=[];
    for(var p=1;p<=pdf.numPages;p++){
      jobs.push(pdf.getPage(p).then(function(page){return page.getTextContent();}));
    }
    return Promise.all(jobs);
  }).then(function(contents){
    var lines=[];
    contents.forEach(function(c){lines=lines.concat(itemsToLines(c.items));});
    var res=rowsFromLines(lines,dayFirst);
    res.text=lines.join("\n");
    return res;
  });
}

/* ---------- wspólne: duplikaty i podgląd ---------- */

function markDuplicates(rows){
  var have={};
  S.reservations.forEach(function(r){
    have[r.date+"|"+Math.round(n(r.amount)*100)]=true;
  });
  rows.forEach(function(row){
    row.dup=!!have[row.date+"|"+Math.round(row.amount*100)];
    if(row.dup)row.sel=false;
  });
  return rows;
}

function openImport(result,source,fileName,rawText,fromSheet){
  var rows=markDuplicates(result.rows||[]);
  UI.imp={source:source,file:fileName,rows:rows,
    warnings:result.warnings||[],text:rawText||result.text||"",
    dayFirst:UI.imp?UI.imp.dayFirst:false,busy:false,error:null,
    fromSheet:!!fromSheet};
  UI.sheet=false;UI.form=null;
  render();
}

function handleImportFile(file,fromSheet){
  var name=(file.name||"").toLowerCase();
  var dayFirst=UI.imp?UI.imp.dayFirst:false;
  UI.imp={source:"…",file:file.name,rows:[],warnings:[],text:"",
    dayFirst:dayFirst,busy:true,error:null,fromSheet:!!fromSheet};
  UI.sheet=false;UI.form=null;
  render();

  if(name.endsWith(".pdf")||file.type==="application/pdf"){
    rowsFromPDF(file,dayFirst).then(function(res){
      openImport(res,"PDF",file.name,null,fromSheet);
    }).catch(function(err){
      UI.imp={source:"PDF",file:file.name,rows:[],warnings:[],text:"",
        dayFirst:dayFirst,busy:false,error:err.message,fromSheet:!!fromSheet};
      render();
    });
    return;
  }

  var reader=new FileReader();
  reader.onload=function(){
    var text=String(reader.result);
    openImport(rowsFromCSV(text,dayFirst),"CSV",file.name,text,fromSheet);
  };
  reader.onerror=function(){
    UI.imp={source:"CSV",file:file.name,rows:[],warnings:[],text:"",
      dayFirst:dayFirst,busy:false,error:"Nie udało się odczytać pliku.",fromSheet:!!fromSheet};
    render();
  };
  reader.readAsText(file,"utf-8");
}

  });

  if(!im.rows.length){

    if(im.text){

function confirmImport(){
  var im=UI.imp;
  var chosen=im.rows.filter(function(r){return r.sel;});
  if(!chosen.length){UI.imp.error=null;toast("Nie zaznaczyłeś żadnej pozycji.");render();return;}

  var months={};
  chosen.forEach(function(r){
    S.reservations.push({
      id:uid(),date:r.date,nights:n(r.nights)||1,amount:n(r.amount),
      cleaning:n(r.cleaning),commission:n(r.commission),
      guest:(r.guest||"").trim()||"Gość z importu"
    });
    months[mKey(r.date)]=true;
  });
  S.reservations.sort(function(a,b){return a.date.localeCompare(b.date);});
  save();

  var keys=Object.keys(months).sort();
  UI.imp=null;
  var target=keys.indexOf(UI.month)>-1?UI.month:keys[keys.length-1];
  if(target===UI.month){
    toast("Dodano "+chosen.length+" rezerwacji z importu.");
  }else{
    toast("Dodano "+chosen.length+" rezerwacji → "+mName(target)+".","Pokaż",target);
  }
  render();
}

function renderToast(){

function render(){

      '<span class="ico">'+t.ico+'</span>'+t.label+'</button>';
  }).join("");

  document.getElementById("fab").classList.toggle("hidden",UI.tab!=="month");
  document.getElementById("modal").innerHTML=UI.imp?viewImport():(UI.sheet?viewSheet():"");
  renderToast();

  if(UI.sheet){
    var a=document.getElementById("amountInput");
    if(a&&!UI.form.customNights)setTimeout(function(){a.focus();},60);
  }
}

function refreshLive(){
  if(UI.sheet&&UI.form){
    var el=document.querySelector('[data-live="stayNet"]');
    if(el)el.textContent=eur(n(UI.form.amount)-n(UI.form.cleaning)-n(UI.form.commission));
    return;
  }
  var sm=summary(UI.month);
  var map={
    fixed:eur(sm.fixed),
    management:sm.month.management==null?"—":eur(n(sm.month.management),2),
    electricityCost:sm.elec.ready?eur(sm.elec.cost,2):"—",
    waterCost:sm.water.ready?eur(sm.water.cost,2):"—",
    electricityUsage:sm.elec.ready?("zużycie "+num(sm.elec.usage,1)+" kWh × "+num(n(sm.month.electricity.rate),2)+" € + "+eur(n(sm.month.electricity.standing))+" opłaty stałej"):"Wpisz stan bieżący, żeby policzyć kwotę.",
    waterUsage:sm.water.ready?("zużycie "+num(sm.water.usage,1)+" m³ × "+num(n(sm.month.water.rate),2)+" € + "+eur(n(sm.month.water.standing))+" opłaty stałej"):"Wpisz stan bieżący, żeby policzyć kwotę."
  };
  Object.keys(map).forEach(function(k){
    var el=document.querySelector('[data-live="'+k+'"]');
    if(el)el.textContent=map[k];
  });
}

function setPath(path,value){
  if(path.indexOf("__")===0){
    if(path==="__extraAmount")UI.extra.amount=value;
    else if(path==="__extraNote")UI.extra.note=value;
    else if(path==="__paste")UI.paste=value;
    else if(path.indexOf("__form.")===0)UI.form[path.slice(7)]=value;
    else if(path.indexOf("__imp.")===0&&UI.imp){
      // __imp.3.amount → wiersz 3, pole amount
      var p=path.split(".");
      var row=UI.imp.rows[+p[1]];
      if(row)row[p[2]]=n(value);
    }
    return false;
  }
  var parts=path.split("."),obj=S;
  for(var i=0;i<parts.length-1;i++)obj=obj[parts[i]];
  var last=parts[parts.length-1];
  var numeric=["comunidad","internet","ochrona","management","rate","standing","ibiAnnual","taxRate","prev","curr","invoice"];
  obj[last]=numeric.indexOf(last)>=0?(value===""?null:n(value)):value;
  return true;
}

/* Zapis rezerwacji: edycja aktualizuje wpis po identyfikatorze,
   dodawanie zawsze dokłada nowy element do listy. */
function commitReservation(){
  var f=UI.form,amount=n(f.amount),nights=n(f.nights);
  if(!amount){f.error="Wpisz przychód brutto.";render();return null;}
  if(!nights){f.error="Podaj liczbę nocy.";render();return null;}

  var payload={
    date:f.date,nights:nights,amount:amount,
    cleaning:n(f.cleaning),commission:n(f.commission),
    guest:(f.guest||"").trim()||"Rezerwacja"
  };

  if(f.editId){
    S.reservations=S.reservations.map(function(r){
      return r.id===f.editId?Object.assign({},r,payload):r;
    });
  }else{
    S.reservations=S.reservations.concat([Object.assign({id:uid()},payload)]);
  }
  S.reservations.sort(function(a,b){return a.date.localeCompare(b.date);});
  save();
  return payload;
}

document.addEventListener("input",function(e){
  var bind=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(!bind)return;
  if(setPath(bind,e.target.value))save();
  refreshLive();
});

document.addEventListener("change",function(e){
  if(!e.target.files||!e.target.files[0])return;

  if(e.target.id==="fileInput"){          // kopia danych aplikacji
    var reader=new FileReader();
    reader.onload=function(){applyBackupText(String(reader.result));};
    reader.onerror=function(){UI.msg={ok:false,text:"Nie udało się otworzyć pliku."};render();};
    reader.readAsText(e.target.files[0]);
    return;
  }

  if(e.target.classList&&e.target.classList.contains("import-input")){
    // CSV z Airbnb albo PDF z rozliczeniem; „sheet" oznacza wywołanie z panelu dodawania
    handleImportFile(e.target.files[0],e.target.getAttribute("data-from")==="sheet");
    e.target.value="";                    // ten sam plik da się wgrać ponownie
  }
});

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(!t)return;
  var act=t.getAttribute("data-act"),val=t.getAttribute("data-val"),id=t.getAttribute("data-id");

  switch(act){
    case "tab": UI.tab=val;UI.msg=null;render(); break;
    case "prev-month": UI.month=shiftMonth(UI.month,-1); render(); break;
    case "next-month": UI.month=shiftMonth(UI.month,1); render(); break;
    case "this-month": UI.month=curMonth(); render(); break;
    case "go-month": UI.month=val; render(); break;
    case "toggle-all": UI.showAll=!UI.showAll; render(); break;

    case "toast-action":
      if(val){UI.month=val;UI.tab="month";}
      UI.toast=null;render();
      break;
    case "toast-close": UI.toast=null;renderToast(); break;

    /* --- import CSV / PDF --- */
    case "close-import":
      var backToSheet=UI.imp&&UI.imp.fromSheet;
      UI.imp=null;
      if(backToSheet){
        // wróć tam, skąd przyszedłeś — do pustego formularza rezerwacji
        UI.form={editId:null,amount:"",nights:5,customNights:false,date:todayISO(),
          cleaning:"",commission:"",guest:"",error:""};
        UI.sheet=true;
      }
      render();
      break;
    case "imp-toggle":
      var rr=UI.imp.rows[+val];
      if(rr)rr.sel=!rr.sel;
      render();
      break;
    case "imp-all":
      UI.imp.rows.forEach(function(r){r.sel=(val==="1");});
      render();
      break;
    case "imp-dayfirst":
      // przełączenie odczytu 03/04 między marcem a kwietniem wymaga ponownego parsowania
      UI.imp.dayFirst=!UI.imp.dayFirst;
      if(UI.imp.source==="CSV"&&UI.imp.text){
        var again=rowsFromCSV(UI.imp.text,UI.imp.dayFirst);
        UI.imp.rows=markDuplicates(again.rows);
        UI.imp.warnings=again.warnings;
      }else if(UI.imp.source==="PDF"&&UI.imp.text){
        var again2=rowsFromLines(UI.imp.text.split("\n"),UI.imp.dayFirst);
        UI.imp.rows=markDuplicates(again2.rows);
        UI.imp.warnings=again2.warnings;
      }
      render();
      break;
    case "imp-confirm": confirmImport(); break;

    case "mode":
      ensureMonth(UI.month)[t.getAttribute("data-kind")].mode=val; save(); render(); break;

    case "copy-fixed":
      var prev=S.months[shiftMonth(UI.month,-1)];
      if(prev){
        var cur=ensureMonth(UI.month);
        if(prev.fixed)cur.fixed=Object.assign({},prev.fixed);
        if(prev.management!=null)cur.management=prev.management;
        save();render();
      }
      break;

    case "extra-cat": UI.extra.category=val; render(); break;
    case "add-extra":
      var amt=n(UI.extra.amount);
      if(!amt)return;
      var m=ensureMonth(UI.month);
      m.extras=(m.extras||[]).concat([{id:uid(),category:UI.extra.category,
        amount:amt,note:UI.extra.note.trim()||catOf(UI.extra.category).label}]);
      UI.extra.amount="";UI.extra.note="";save();render();
      break;
    case "del-extra":
      var mm=ensureMonth(UI.month);
      mm.extras=mm.extras.filter(function(x){return x.id!==id;});
      save();render();
      break;

    /* --- rezerwacje --- */
    case "open-sheet":
      UI.form={editId:null,amount:"",nights:5,customNights:false,date:todayISO(),
        cleaning:"",commission:"",guest:"",error:""};
      UI.sheet=true;render();
      break;

    case "edit-res":
      var r0=null;
      S.reservations.forEach(function(r){if(r.id===id)r0=r;});
      if(!r0)return;
      UI.form={editId:r0.id,amount:String(r0.amount),nights:r0.nights,
        customNights:[1,2,3,4,5,6,7].indexOf(n(r0.nights))<0,
        date:r0.date,cleaning:String(r0.cleaning||""),commission:String(r0.commission||""),
        guest:r0.guest||"",error:""};
      UI.sheet=true;render();
      break;

    case "del-res":
      var victim=null;
      S.reservations.forEach(function(r){if(r.id===id)victim=r;});
      if(!victim)return;
      if(!confirm('Usunąć rezerwację "'+victim.guest+'" z '+dayLabel(victim.date)+"?"))return;
      S.reservations=S.reservations.filter(function(r){return r.id!==id;});
      UI.sheet=false;UI.form=null;
      save();toast("Usunięto rezerwację.");render();
      break;

    case "save-res":
      var saved=commitReservation();
      if(!saved)return;
      var wasEdit=!!UI.form.editId;
      var target=mKey(saved.date);
      UI.sheet=false;UI.form=null;
      if(wasEdit){
        toast("Zmiany zapisane.");
      }else if(target===UI.month){
        toast("Dodano gościa. W tym miesiącu: "+staysIn(UI.month).length+" rezerwacji.");
      }else{
        // Nie przeskakujemy sami — zostajesz tam, gdzie byłeś
        toast("Dodano do: "+mName(target)+".","Pokaż",target);
      }
      render();
      break;

    case "save-next":
      var savedNext=commitReservation();
      if(!savedNext)return;
      var mk=mKey(savedNext.date);
      // Arkusz zostaje otwarty, data i koszty przygotowane pod kolejnego gościa
      UI.form={editId:null,amount:"",nights:5,customNights:false,date:savedNext.date,
        cleaning:"",commission:"",guest:"",error:""};
      toast("Zapisano „"+savedNext.guest+"”. Łącznie w "+mName(mk)+": "+staysIn(mk).length+".");
      render();
      break;

    case "close-sheet": UI.sheet=false;UI.form=null;render(); break;
    case "nights": UI.form.nights=+val;UI.form.customNights=false;render(); break;
    case "nights-custom": UI.form.customNights=!UI.form.customNights;render(); break;
    case "date": UI.form.date=val;render(); break;

    /* --- kopie --- */
    case "share-json": shareBackup(); break;
    case "download-json": downloadBackup(); break;
    case "copy-json":
      var json=JSON.stringify(S,null,2);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(function(){
          UI.msg={ok:true,text:"Kopia w schowku — wklej ją w notatkę albo maila."};render();
        },function(){
          UI.msg={ok:false,text:"Schowek niedostępny. Użyj przycisku „Wyślij kopię”."};render();
        });
      }else{
        UI.msg={ok:false,text:"Schowek niedostępny w tej przeglądarce."};render();
      }
      break;
    case "paste-json": applyBackupText(UI.paste||""); break;

    case "offline-retry":
      OFFLINE={ok:false,state:"sprawdzam…",detail:"",files:0};
      render();offlineDiagnose();
      break;
    case "offline-refresh":
      // usuwa cache i wyrejestrowuje workera, po czym ładuje stronę od nowa
      (window.caches?caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }):Promise.resolve()).then(function(){
        return navigator.serviceWorker.getRegistrations();
      }).then(function(regs){
        return Promise.all(regs.map(function(r){return r.unregister();}));
      }).then(function(){location.reload(true);})
        .catch(function(){location.reload();});
      break;

    case "reset":
      if(confirm("Skasować wszystkie dane z tego telefonu? Tej operacji nie da się cofnąć.")){
        localStorage.removeItem(STORE_KEY);S=seed();UI.month=curMonth();save();render();
      }
      break;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&UI.sheet&&e.target.id==="amountInput"){
    e.preventDefault();
    var b=document.querySelector('[data-act="save-res"]');
    if(b)b.click();
  }
});

render();

/* ================================================================= */
/*  Tryb offline — rejestracja i rozpoznanie przyczyny niepowodzenia  */
/* ================================================================= */

function setOffline(ok,state,detail,files){
  OFFLINE={ok:ok,state:state,detail:detail||"",files:files||0};
  if(UI.tab==="settings")render();
}

function countCached(){
  if(!window.caches)return Promise.resolve(0);
  return caches.keys().then(function(keys){
    var jobs=keys.map(function(k){return caches.open(k).then(function(c){return c.keys();});});
    return Promise.all(jobs);
  }).then(function(lists){
    return lists.reduce(function(a,l){return a+l.length;},0);
  }).catch(function(){return 0;});
}

function offlineDiagnose(){
  var loc=window.location;

  if(!("serviceWorker" in navigator)){
    setOffline(false,"Przeglądarka nie obsługuje trybu offline",
      "W trybie incognito / prywatnym Chrome i Samsung Internet wyłączają service workery. Otwórz aplikację w zwykłej karcie.");
    return;
  }

  // Najczęstsza przyczyna: plik otwarty prosto z pamięci telefonu albo przez http://
  var secure=(loc.protocol==="https:")||loc.hostname==="localhost"||loc.hostname==="127.0.0.1";
  if(!secure){
    var why=(loc.protocol==="file:"||loc.protocol==="content:")
      ? "Otworzyłeś plik bezpośrednio z pamięci telefonu. Tryb offline i instalacja działają tylko wtedy, gdy aplikacja jest serwowana przez HTTPS."
      : "Adres używa http:// zamiast https://. Tryb offline wymaga połączenia szyfrowanego.";
    setOffline(false,"Aplikacja nie działa pod adresem HTTPS",
      why+" Otwórz ją z adresu github.io (patrz instrukcja instalacji). Bieżący adres: "+loc.protocol+"//"+(loc.host||"—"));
    return;
  }

  // Czy sw.js w ogóle leży obok index.html? GitHub Pages na brak pliku
  // odpowiada stroną 404 w HTML, a przeglądarka odrzuca taki service worker.
  fetch("./sw.js",{cache:"no-store"}).then(function(res){
    var ct=(res.headers.get("content-type")||"").toLowerCase();
    if(!res.ok){
      throw new Error("Serwer zwrócił HTTP "+res.status+" dla pliku sw.js. Wgraj sw.js do repozytorium, obok index.html.");
    }
    if(ct.indexOf("html")>-1){
      throw new Error("Pod adresem sw.js serwer zwraca stronę HTML — to znaczy, że tego pliku tam nie ma. Wgraj sw.js obok index.html.");
    }
    return navigator.serviceWorker.register("./sw.js");
  }).then(function(reg){
    return navigator.serviceWorker.ready.then(function(){return reg;});
  }).then(function(){
    return countCached();
  }).then(function(count){
    if(count>0){
      setOffline(true,"Działa","Aplikacja otworzy się bez internetu. W pamięci podręcznej: "+count+" plików.",count);
    }else{
      setOffline(true,"Włączony, trwa pobieranie",
        "Service worker działa, ale nie zapisał jeszcze plików. Zostaw aplikację otwartą kilkanaście sekund przy internecie.",0);
    }
  }).catch(function(err){
    setOffline(false,"Nie udało się włączyć",String(err.message||err));
  });
}

/* Pierwsze uruchomienie po wczytaniu strony */
window.addEventListener("load",offlineDiagnose);
